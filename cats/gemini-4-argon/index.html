        this.rightEyeGroup = this.createEyeAssembly(false);
        this.rightEyeGroup.position.set(-0.080, 0.038, 0.208);
        this.rightEyeGroup.rotation.set(-0.04, -0.30, 0.05);
        this.headGroup.add(this.rightEyeGroup);

        // 5. Sculpted Ears (Pinnae) with Inner Pink Concavity & Ear Furnishings
        this.leftEarGroup = this.createEarAssembly(true);
        this.leftEarGroup.position.set(0.112, 0.152, 0.015);
        this.headGroup.add(this.leftEarGroup);

        this.rightEarGroup = this.createEarAssembly(false);
        this.rightEarGroup.position.set(-0.112, 0.152, 0.015);
        this.headGroup.add(this.rightEarGroup);

        // 6. Curved Tapered Whiskers (Mystacial & Superciliary Vibrissae)
        this.whiskerGroup = new THREE.Group();
        this.headGroup.add(this.whiskerGroup);
        this.buildWhiskers();

        // 7. Four Articulated Legs with Sculpted Paws, Toe Beans & Claws
        this.frontLeftLeg = this.createForeleg(true);
        this.frontLeftLeg.group.position.set(0.115, 0.46, 0.34);
        this.bodyGroup.add(this.frontLeftLeg.group);

        this.frontRightLeg = this.createForeleg(false);
        this.frontRightLeg.group.position.set(-0.115, 0.46, 0.34);
        this.bodyGroup.add(this.frontRightLeg.group);

        this.backLeftLeg = this.createHindleg(true);
        this.backLeftLeg.group.position.set(0.122, 0.47, -0.34);
        this.bodyGroup.add(this.backLeftLeg.group);

        this.backRightLeg = this.createHindleg(false);
        this.backRightLeg.group.position.set(-0.122, 0.47, -0.34);
        this.bodyGroup.add(this.backRightLeg.group);

        // 8. 16-Segment Articulated Tail
        this.buildTail();
      }

      createEyeAssembly(isLeft) {
        const group = new THREE.Group();
        const r = 0.044;

        // Convex Anterior Iris Dome facing directly along +Z with planar UV mapping (0.5, 0.5 at center!)
        const irisGeo = new THREE.CircleGeometry(r, 36);
        const irisPos = irisGeo.attributes.position;
        for (let i = 0; i < irisPos.count; i++) {
          const x = irisPos.getX(i);
          const y = irisPos.getY(i);
          const d2 = Math.min(1.0, (x * x + y * y) / (r * r));
          irisPos.setZ(i, Math.sqrt(Math.max(0, 1.0 - d2)) * r * 0.72 + 0.004);
        }
        irisGeo.computeVertexNormals();
        const irisMesh = new THREE.Mesh(irisGeo, isLeft ? this.leftIrisMat : this.rightIrisMat);
        group.add(irisMesh);

        // Refractive Wet Cornea Dome bulging forward over the iris
        const corneaGeo = new THREE.CircleGeometry(r * 1.01, 36);
        const cPos = corneaGeo.attributes.position;
        for (let i = 0; i < cPos.count; i++) {
          const x = cPos.getX(i);
          const y = cPos.getY(i);
          const d2 = Math.min(1.0, (x * x + y * y) / (r * r));
          cPos.setZ(i, Math.sqrt(Math.max(0, 1.0 - d2)) * r * 0.84 + 0.006);
        }
        corneaGeo.computeVertexNormals();
        const corneaMesh = new THREE.Mesh(corneaGeo, this.corneaMaterial);
        group.add(corneaMesh);

        // Dark Feline Eyeliner Rim framing the eye opening
        const rimGeo = new THREE.TorusGeometry(r * 1.01, 0.0048, 12, 36);
        rimGeo.scale(1.05, 0.94, 1.0);
        const rimMesh = new THREE.Mesh(rimGeo, new THREE.MeshBasicMaterial({ color: 0x110d0d }));
        rimMesh.position.z = 0.005;
        group.add(rimMesh);

        // Anterior Curved Eyelid Shells anchored at top (+r) and bottom (-r) rims so open eyes are 100% unobstructed
        const makeLidGeo = (isUpper) => {
          const lidGeo = new THREE.CircleGeometry(r * 1.04, 32, isUpper ? 0 : Math.PI, Math.PI);
          const lPos = lidGeo.attributes.position;
          const R = r * 1.04;
          for (let i = 0; i < lPos.count; i++) {
            const x = lPos.getX(i);
            const y = lPos.getY(i);
            const zCurve = Math.sqrt(Math.max(0, R * R - x * x)) * 0.88 + 0.008;
            lPos.setZ(i, zCurve);
            // Shift anchor to top (+R) or bottom (-R) rim so scale.y sweeps lid smoothly across the eye
            lPos.setY(i, y - (isUpper ? R : -R));
          }
          lidGeo.computeVertexNormals();
          return lidGeo;
        };

        const upperLid = new THREE.Mesh(makeLidGeo(true), this.headFurMaterial);
        upperLid.position.y = r * 1.04;
        upperLid.scale.y = 0.05;
        upperLid.visible = false;
        group.add(upperLid);

        const lowerLid = new THREE.Mesh(makeLidGeo(false), this.headFurMaterial);
        lowerLid.position.y = -r * 1.04;
        lowerLid.scale.y = 0.05;
        lowerLid.visible = false;
        group.add(lowerLid);

        group.userData = { irisMesh, upperLid, lowerLid };
        return group;
      }

      createEarAssembly(isLeft) {
        const group = new THREE.Group();
        const sign = isLeft ? 1 : -1;

        const outerEar = new THREE.Mesh(this.createSculptedEarGeometry(isLeft), this.earFurMaterial);
        outerEar.castShadow = true;
        outerEar.userData.zone = 'ears';
        this.interactableMeshes.push(outerEar);
        group.add(outerEar);

        // Pink inner auricle hollow recessed neatly inside the conch
        const innerGeo = new THREE.ConeGeometry(0.055, 0.155, 24, 12);
        innerGeo.translate(0, 0.082, 0.006);
        innerGeo.scale(0.82, 1.0, 0.22);
        const innerEar = new THREE.Mesh(innerGeo, this.innerEarMaterial);
        innerEar.userData.zone = 'ears';
        this.interactableMeshes.push(innerEar);
        group.add(innerEar);

        // Delicate short ear furnishings inside ear base
        for (let t = 0; t < 3; t++) {
          const tuftGeo = new THREE.ConeGeometry(0.005, 0.032, 8);
          tuftGeo.translate(0, 0.016, 0);
          const tuft = new THREE.Mesh(tuftGeo, this.whiteFurMaterial);
          tuft.position.set(-sign * 0.028, 0.025 + t * 0.018, 0.012);
          tuft.rotation.z = -sign * (0.75 + t * 0.1);
          tuft.rotation.x = 0.2;
          group.add(tuft);
        }

        // Default alert ear angle
        group.rotation.set(0.14, sign * 0.22, -sign * 0.28);
        return group;
      }

      buildWhiskers() {
        for (const side of [-1, 1]) {
          // 6 mystacial whiskers per cheek pad originating from the plump muzzle pads
          for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 2; col++) {
              const x0 = side * (0.052 + col * 0.010);
              const y0 = -0.034 - row * 0.011;
              const z0 = 0.252 - col * 0.012;

              const len = 0.19 + (2 - row) * 0.022 + col * 0.018;
              const curve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(x0, y0, z0),
                new THREE.Vector3(x0 + side * len * 0.48, y0 - row * 0.005, z0 - 0.015),
                new THREE.Vector3(x0 + side * len, y0 - 0.020 - row * 0.014, z0 - 0.055)
              ]);
              const tubeGeo = new THREE.TubeGeometry(curve, 12, 0.0012, 5, false);
              const whisker = new THREE.Mesh(tubeGeo, this.whiskerMaterial);
              this.whiskerGroup.add(whisker);
            }
          }

          // 2 superciliary (eyebrow) whiskers per side
          for (let b = 0; b < 2; b++) {
            const bx = side * (0.068 + b * 0.014);
            const by = 0.088 + b * 0.008;
            const bz = 0.175;
            const bCurve = new THREE.CatmullRomCurve3([
              new THREE.Vector3(bx, by, bz),
              new THREE.Vector3(bx + side * 0.055, by + 0.055, bz - 0.01),
              new THREE.Vector3(bx + side * 0.105, by + 0.082, bz - 0.035)
            ]);
            const bGeo = new THREE.TubeGeometry(bCurve, 10, 0.0011, 5, false);
            this.whiskerGroup.add(new THREE.Mesh(bGeo, this.whiskerMaterial));
          }
        }
      }

      createPawAssembly(isFront) {
        const pawGroup = new THREE.Group();

        // Sculpted 4 oval feline digits (toes) + pink toe beans underneath + retractable claws
        const claws = [];
        const toeOffsets = [-0.028, -0.0095, 0.0095, 0.028];

        // Smooth dorsal paw bridge
        const pawTop = new THREE.Mesh(new THREE.SphereGeometry(0.036, 18, 14), this.pawFurMaterial);
        pawTop.scale.set(1.12, 0.58, 1.18);
        pawTop.position.set(0, 0.004, 0.016);
        pawTop.castShadow = true;
        pawGroup.add(pawTop);

        // Main central metacarpal pad (big heart-shaped bean on underside)
        const mainPad = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 12), this.pawPadMaterial);
        mainPad.scale.set(1.25, 0.45, 1.15);
        mainPad.position.set(0, -0.015, 0.012);
        pawGroup.add(mainPad);

        const toeMeshes = [];
        for (let i = 0; i < 4; i++) {
          const isInner = i === 1 || i === 2;
          const zOff = (isInner ? 0.040 : 0.031) * (isFront ? 1.05 : 1.10);
          const xOff = toeOffsets[i];

          const toeGeo = new THREE.SphereGeometry(0.017, 16, 14);
          toeGeo.scale(0.84, 0.78, 1.35);
          const toe = new THREE.Mesh(toeGeo, this.pawFurMaterial);
          toe.position.set(xOff, -0.002, zOff);
          toe.castShadow = true;
          toe.userData.zone = 'paws';
          this.interactableMeshes.push(toe);
          pawGroup.add(toe);
          toeMeshes.push(toe);

          // Digital toe bean underneath
          const bean = new THREE.Mesh(new THREE.SphereGeometry(0.009, 12, 10), this.pawPadMaterial);
          bean.scale.set(0.9, 0.48, 1.15);
          bean.position.set(xOff, -0.014, zOff + 0.004);
          pawGroup.add(bean);

          // Curved retractable claw
          const clawGeo = new THREE.ConeGeometry(0.0030, 0.017, 8);
          clawGeo.rotateX(Math.PI * 0.62);
          const claw = new THREE.Mesh(clawGeo, this.clawMaterial);
          claw.position.set(xOff, -0.004, zOff + 0.020);
          claw.scale.setScalar(0.2); // Retracted by default
          pawGroup.add(claw);
          claws.push(claw);
        }

        return { pawGroup, claws, toeMeshes };
      }

      createForeleg(isLeft) {
        const group = new THREE.Group();

        // Coaxial Shoulder Sphere + Tapered Humerus (zero offset caps!)
        const shoulderCap = new THREE.Mesh(new THREE.SphereGeometry(0.056, 16, 14), this.legFurMaterial);
        shoulderCap.castShadow = true;
        group.add(shoulderCap);

        const humerusGeo = new THREE.CylinderGeometry(0.055, 0.042, 0.155, 18);
        humerusGeo.translate(0, -0.0775, 0);
        const shoulderMesh = new THREE.Mesh(humerusGeo, this.legFurMaterial);
        shoulderMesh.castShadow = true;
        shoulderMesh.userData.zone = 'back';
        this.interactableMeshes.push(shoulderMesh);
        group.add(shoulderMesh);

        // Elbow joint at exact distal end of humerus (0, -0.155, 0)
        const elbowGroup = new THREE.Group();
        elbowGroup.position.set(0, -0.155, 0);
        group.add(elbowGroup);

        const elbowCap = new THREE.Mesh(new THREE.SphereGeometry(0.042, 14, 12), this.legFurMaterial);
        elbowGroup.add(elbowCap);

        const forearmGeo = new THREE.CylinderGeometry(0.042, 0.032, 0.175, 18);
        forearmGeo.translate(0, -0.0875, 0);
        const forearmMesh = new THREE.Mesh(forearmGeo, this.legFurMaterial);
        forearmMesh.castShadow = true;
        elbowGroup.add(forearmMesh);

        // Wrist (Carpus) at exact distal end of forearm (0, -0.175, 0)
        const wristGroup = new THREE.Group();
        wristGroup.position.set(0, -0.175, 0);
        elbowGroup.add(wristGroup);

        const wristBridge = new THREE.Mesh(new THREE.SphereGeometry(0.033, 14, 12), this.legFurMaterial);
        wristBridge.castShadow = true;
        wristGroup.add(wristBridge);

        const paw = this.createPawAssembly(true);
        paw.pawGroup.position.set(0, -0.022, 0.014);
        wristGroup.add(paw.pawGroup);

        return { group, elbowGroup, wristGroup, paw, forearmMesh, wristBridge };
      }

      createHindleg(isLeft) {
        const group = new THREE.Group();

        // Coaxial Hip Sphere + Tapered Femur along local -Y (zero offset so joints never separate!)
        const hipCap = new THREE.Mesh(new THREE.SphereGeometry(0.068, 16, 14), this.legFurMaterial);
        hipCap.scale.set(0.85, 1.05, 1.15);
        hipCap.castShadow = true;
        group.add(hipCap);

        const thighGeo = new THREE.CylinderGeometry(0.064, 0.045, 0.150, 18);
        thighGeo.translate(0, -0.075, 0);
        const thighMesh = new THREE.Mesh(thighGeo, this.legFurMaterial);
        thighMesh.castShadow = true;
        thighMesh.userData.zone = 'back';
        this.interactableMeshes.push(thighMesh);
        group.add(thighMesh);

        // Knee / Stifle at exact distal end of femur (0, -0.150, 0)
        const kneeGroup = new THREE.Group();
        kneeGroup.position.set(0, -0.150, 0);
        group.add(kneeGroup);

        const kneeCap = new THREE.Mesh(new THREE.SphereGeometry(0.045, 14, 12), this.legFurMaterial);
        kneeGroup.add(kneeCap);

        const crusGeo = new THREE.CylinderGeometry(0.045, 0.033, 0.150, 18);
        crusGeo.translate(0, -0.075, 0);
        const crusMesh = new THREE.Mesh(crusGeo, this.legFurMaterial);
        crusMesh.castShadow = true;
        kneeGroup.add(crusMesh);

        // Hock / Ankle Joint at exact distal end of crus (0, -0.150, 0)
        const hockGroup = new THREE.Group();
        hockGroup.position.set(0, -0.150, 0);
        kneeGroup.add(hockGroup);

        const hockCap = new THREE.Mesh(new THREE.SphereGeometry(0.034, 14, 12), this.legFurMaterial);
        hockGroup.add(hockCap);

        const metatarsusGeo = new THREE.CylinderGeometry(0.033, 0.028, 0.115, 16);
        metatarsusGeo.translate(0, -0.0575, 0);
        const metatarsusMesh = new THREE.Mesh(metatarsusGeo, this.legFurMaterial);
        metatarsusMesh.castShadow = true;
        hockGroup.add(metatarsusMesh);

        const paw = this.createPawAssembly(false);
        paw.pawGroup.position.set(0, -0.115, 0.022);
        hockGroup.add(paw.pawGroup);

        return { group, thighMesh, kneeGroup, hockGroup, metatarsusMesh, paw };
      }

      buildTail() {
        this.tailRoot = new THREE.Group();
        this.tailRoot.position.set(0, 0.50, -0.45);
        this.bodyGroup.add(this.tailRoot);

        this.tailSegments = [];
        let parent = this.tailRoot;
        const count = 16;
        const segLen = 0.046;

        for (let i = 0; i < count; i++) {
          const t = i / (count - 1);
          const r0 = THREE.MathUtils.lerp(0.040, 0.022, t);
          const r1 = THREE.MathUtils.lerp(0.038, 0.018, Math.min(1, t + 1 / count));

          const pivot = new THREE.Group();
          if (i > 0) pivot.position.set(0, 0, -segLen);
          parent.add(pivot);

          const segGeo = new THREE.CylinderGeometry(r1, r0, segLen * 1.22, 16);
          segGeo.rotateX(Math.PI / 2);
          segGeo.translate(0, 0, -segLen * 0.5);
          const segMesh = new THREE.Mesh(segGeo, this.tailFurMaterial);
          segMesh.castShadow = true;
          segMesh.userData.zone = 'tail';
          this.interactableMeshes.push(segMesh);
          pivot.add(segMesh);

          if (i === count - 1) {
            const tipCap = new THREE.Mesh(new THREE.SphereGeometry(r1 * 1.05, 14, 12), this.tailFurMaterial);
            tipCap.position.set(0, 0, -segLen);
            pivot.add(tipCap);
          }

          this.tailSegments.push({ pivot, segMesh });
          parent = pivot;
        }
      }

      // -------------------------------------------------------------------------
      // Dynamic Coat & Eye Switching
      // -------------------------------------------------------------------------
      applyCoatAndEyes() {
        const preset = COAT_PRESETS[this.coatKey] || COAT_PRESETS.ginger;
        const patternMap = { tabby: 0, tuxedo: 1, siamese: 2, solid: 3, calico: 4 };
        this.coatUniforms.uPatternType.value = patternMap[preset.pattern] ?? 0;
        this.coatUniforms.uBaseColor.value.set(preset.base);
        this.coatUniforms.uSecColor.value.set(preset.secondary);
        this.coatUniforms.uStripeColor.value.set(preset.stripe);
        this.coatUniforms.uBellyColor.value.set(preset.bellyHex);

        this.whiteFurMaterial.color.set(preset.bellyHex);
        this.noseMaterial.color.set(preset.nose);
        this.pawPadMaterial.color.set(preset.pawPad);
        this.innerEarMaterial.color.set(preset.innerEar);

        // Update eye pigmentation
        const eyeColors = EYE_PRESETS[this.eyeKey] || EYE_PRESETS.emerald;
        this.leftEyeTex = createEyeIrisTexture(eyeColors.left, this.pupilDilation);
        this.rightEyeTex = createEyeIrisTexture(eyeColors.right, this.pupilDilation);
        this.leftIrisMat.map = this.leftEyeTex.texture;
        this.rightIrisMat.map = this.rightEyeTex.texture;
        this.leftIrisMat.needsUpdate = true;
        this.rightIrisMat.needsUpdate = true;
      }

      triggerMeow(style = 'meow') {
        this.meowTimer = style === 'chirp' ? 0.35 : 0.72;
        audio.playMeow(style);
      }

      triggerBoop() {
        this.noseLickTimer = 0.85;
        this.blinkAmount = 0.85;
        this.earTwitchL = 0.5;
        this.earTwitchR = 0.5;
        this.triggerMeow('chirp');
      }

      // -------------------------------------------------------------------------
      // Main Per-Frame Skeletal & Behavioral Animation Solver
      // -------------------------------------------------------------------------
      update(dt, time, worldState) {
        // 1. Handle Petting & Affection Decay
        if (this.petDecayTimer > 0) {
          this.petDecayTimer -= dt;
          this.purrLevel = Math.min(1.0, this.purrLevel + dt * 0.9);
          this.affection = Math.min(1.0, this.affection + dt * 0.06);
        } else {
          this.petZone = null;
          const restingPurr = (this.currentBehavior === 'belly' || this.currentBehavior === 'loaf') ? 0.22 : 0.0;
          this.purrLevel += (restingPurr - this.purrLevel) * Math.min(1, dt * 1.4);
        }

        audio.updatePurr(dt, this.purrLevel, time);

        // 2. Determine Active Behavior State
        this.behaviorTimer += dt;
        if (worldState.laserActive) {
          this.currentBehavior = 'laser';
          this.targetPupilDilation = 0.82; // Excited wide pupils!
        } else if (worldState.featherActive) {
          this.currentBehavior = 'feather';
          this.targetPupilDilation = 0.78;
        } else if (worldState.activeTreat) {
          this.currentBehavior = 'eat';
          this.targetPupilDilation = 0.58;
        } else if (worldState.yarnMoving) {
          this.currentBehavior = 'chase_yarn';
          this.targetPupilDilation = 0.75;
        } else if (this.poseMode !== 'auto') {
          this.currentBehavior = this.poseMode;
          this.targetPupilDilation = this.currentBehavior === 'sleep' ? 0.2 : 0.34;
        } else {
          // Autonomous Feline AI State Machine
          if (this.behaviorTimer > 8.5) {
            this.behaviorTimer = 0;
            const choices = ['sit', 'walk', 'groom', 'stretch', 'loaf', 'sit'];
            this.currentBehavior = choices[Math.floor(Math.random() * choices.length)];
            if (this.currentBehavior === 'walk') {
              const angle = Math.random() * Math.PI * 2;
              const dist = 0.65 + Math.random() * 0.95;
              this.targetPosition.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);
            }
          }
          this.targetPupilDilation = 0.32 + this.purrLevel * 0.28;
        }

        // Update Dynamic Vertical Slit Pupils
        if (!this.manualPupilOverride) {
          if (Math.abs(this.targetPupilDilation - this.pupilDilation) > 0.015) {
            this.pupilDilation += (this.targetPupilDilation - this.pupilDilation) * Math.min(1, dt * 4.5);
            this.leftEyeTex.update(this.pupilDilation);
            this.rightEyeTex.update(this.pupilDilation);
            document.getElementById('pupil-slider').value = Math.round(this.pupilDilation * 100);
          }
        }

        // 3. Navigation & Locomotion
        let moveSpeed = 0;
        let isWalking = false;
        let isCrouching = false;

        if (this.currentBehavior === 'laser') {
          this.lookTarget.copy(worldState.laserPoint);
          const toLaser = new THREE.Vector3().subVectors(worldState.laserPoint, this.position);
          toLaser.y = 0;
          const dist = toLaser.length();
          if (dist > 0.42) {
            this.targetPosition.copy(worldState.laserPoint);
            this.targetPosition.y = 0;
            moveSpeed = dist > 1.1 ? 1.85 : 1.15;
            isWalking = true;
          } else {
            isCrouching = true;
          }
        } else if (this.currentBehavior === 'chase_yarn') {
          this.lookTarget.copy(worldState.yarnPos);
          const toYarn = new THREE.Vector3().subVectors(worldState.yarnPos, this.position);
          toYarn.y = 0;
          const dist = toYarn.length();
          if (dist > 0.36) {
            this.targetPosition.copy(worldState.yarnPos);
            this.targetPosition.y = 0;
            moveSpeed = 1.55;
            isWalking = true;
          } else if (worldState.onCatBatYarn) {
            worldState.onCatBatYarn(this.heading);
          }
        } else if (this.currentBehavior === 'eat' && worldState.activeTreat) {
          this.lookTarget.copy(worldState.activeTreat.position);
          const toTreat = new THREE.Vector3().subVectors(worldState.activeTreat.position, this.position);
          toTreat.y = 0;
          const dist = toTreat.length();
          if (dist > 0.44) {
            this.targetPosition.copy(worldState.activeTreat.position);
            this.targetPosition.y = 0;
            moveSpeed = 1.25;
            isWalking = true;
          } else {
            worldState.eatProgress += dt;
          }
        } else if (this.currentBehavior === 'walk') {
          const toTarget = new THREE.Vector3().subVectors(this.targetPosition, this.position);
          toTarget.y = 0;
          if (toTarget.length() < 0.15) {
            const nextAngle = this.heading + 1.1 + Math.random() * 1.4;
            this.targetPosition.set(Math.cos(nextAngle) * 1.15, 0, Math.sin(nextAngle) * 1.15);
          }
          moveSpeed = 0.85;
          isWalking = true;
          this.lookTarget.set(
            this.targetPosition.x,
            0.55,
            this.targetPosition.z
          );
        }

        if (isWalking && moveSpeed > 0) {
          const dir = new THREE.Vector3().subVectors(this.targetPosition, this.position);
          dir.y = 0;
          const dist = dir.length();
          if (dist > 0.05) {
            dir.normalize();
            const desiredHeading = Math.atan2(dir.x, dir.z);
            let angleDiff = desiredHeading - this.heading;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            this.heading += angleDiff * Math.min(1, dt * 6.5);

            const step = Math.min(dist, moveSpeed * dt);
            this.position.addScaledVector(dir, step);
            const prevGait = this.gaitPhase;
            this.gaitPhase += dt * moveSpeed * 8.2;

            // Jingle collar bell on stride peaks
            if (this.collarGroup.visible && Math.floor(this.gaitPhase / Math.PI) !== Math.floor(prevGait / Math.PI)) {
              audio.playBellJingle(0.35);
            }
          }
        }

        this.root.position.copy(this.position);
        this.root.rotation.y = this.heading;

        // 4. Blend Posture Weights Smoothly
        const wantSit = (!isWalking && (this.currentBehavior === 'sit' || this.currentBehavior === 'groom' || this.currentBehavior === 'feather')) ? 1 : 0;
        const wantStretch = (!isWalking && (this.currentBehavior === 'stretch' || isCrouching)) ? 1 : 0;
        const wantLoaf = (!isWalking && (this.currentBehavior === 'loaf' || this.currentBehavior === 'sleep' || this.currentBehavior === 'belly')) ? 1 : 0;
        const wantRoll = (!isWalking && this.currentBehavior === 'belly') ? 1 : 0;

        this.sitBlend = THREE.MathUtils.lerp(this.sitBlend || 0, wantSit, Math.min(1, dt * 4.5));
        this.stretchBlend = THREE.MathUtils.lerp(this.stretchBlend || 0, wantStretch, Math.min(1, dt * 4.5));
        this.loafBlend = THREE.MathUtils.lerp(this.loafBlend || 0, wantLoaf, Math.min(1, dt * 4.5));
        this.rollBlend = THREE.MathUtils.lerp(this.rollBlend || 0, wantRoll, Math.min(1, dt * 4.0));

        // Respiratory & Purr Vibration Phase
        const breathFreq = this.currentBehavior === 'sleep' ? 1.6 : 2.8 + this.purrLevel * 2.5;
        const breathPhase = time * breathFreq;
        const spineSway = isWalking ? Math.sin(this.gaitPhase) : (isCrouching ? Math.sin(time * 22) * 0.6 : 0);

        this.updateTorsoDeformation(this.sitBlend, this.stretchBlend, this.loafBlend, breathPhase, spineSway);

        // Roll body onto side/back during Belly Roll pose
        this.bodyGroup.rotation.z = this.rollBlend * 1.18;
        this.bodyGroup.position.y = -this.rollBlend * 0.12 + (isWalking ? Math.abs(Math.sin(this.gaitPhase * 2)) * 0.016 : 0);

        // Sync chest ruff & belly hit zone with torso posture
        this.chestRuffMesh.position.y = THREE.MathUtils.lerp(0.45, 0.54, this.sitBlend) - this.stretchBlend * 0.14 - this.loafBlend * 0.18;
        this.chestRuffMesh.position.z = THREE.MathUtils.lerp(0.39, 0.24, this.sitBlend) + this.stretchBlend * 0.06;
        this.bellyMesh.position.y = THREE.MathUtils.lerp(0.35, 0.28, this.sitBlend) - this.loafBlend * 0.14;

        // 5. Neck & Head Tracking + Petting Lean
        this.neckGroup.position.y = THREE.MathUtils.lerp(0.57, 0.66, this.sitBlend) - this.stretchBlend * 0.18 - this.loafBlend * 0.22;
        this.neckGroup.position.z = THREE.MathUtils.lerp(0.40, 0.24, this.sitBlend) + this.stretchBlend * 0.10 - this.loafBlend * 0.05;

        this.smoothLookTarget.lerp(this.lookTarget, Math.min(1, dt * 6.5));
        const localLook = this.smoothLookTarget.clone().sub(this.position).applyAxisAngle(new THREE.Vector3(0, 1, 0), -this.heading);

        let targetHeadYaw = THREE.MathUtils.clamp(Math.atan2(localLook.x, Math.max(0.25, localLook.z)), -0.75, 0.75);
        let targetHeadPitch = THREE.MathUtils.clamp(-(localLook.y - 0.62) * 0.65, -0.52, 0.55);
        let targetHeadRoll = Math.sin(time * 0.9) * 0.04;

        if (this.currentBehavior === 'sleep') {
          targetHeadYaw = 0.38;
          targetHeadPitch = 0.42;
          targetHeadRoll = 0.25;
        } else if (this.currentBehavior === 'groom') {
          targetHeadYaw = -0.28;
          targetHeadPitch = 0.36 + Math.sin(time * 6.5) * 0.12;
          targetHeadRoll = -0.22;
        } else if (this.currentBehavior === 'eat') {
          targetHeadYaw = 0;
          targetHeadPitch = 0.52 + Math.sin(time * 9.0) * 0.08;
        }

        // Interactive Petting Head Response (Chin lift, Cheek lean)
        if (this.petZone === 'chin') {
          targetHeadPitch = -0.38; // Blissfully lifts chin for scratches!
          targetHeadRoll = Math.sin(time * 4.5) * 0.18;
        } else if (this.petZone === 'head') {
          targetHeadPitch = 0.12;
          targetHeadRoll = Math.sin(time * 3.5) * 0.14;
        }

        this.headGroup.rotation.y = THREE.MathUtils.lerp(this.headGroup.rotation.y, targetHeadYaw, Math.min(1, dt * 7.0));
        this.headGroup.rotation.x = THREE.MathUtils.lerp(this.headGroup.rotation.x, targetHeadPitch, Math.min(1, dt * 7.0));
        this.headGroup.rotation.z = THREE.MathUtils.lerp(this.headGroup.rotation.z, targetHeadRoll, Math.min(1, dt * 7.0));

        // Bell pendulum swing
        this.bellPivot.rotation.z = Math.sin(this.gaitPhase * 2) * (isWalking ? 0.28 : 0.03);
        this.bellPivot.rotation.x = Math.cos(this.gaitPhase) * (isWalking ? 0.18 : 0.02);

        // 6. Eyelids (Blinking, Slow-Blinking when Purring, Sleeping)
        this.blinkTimer -= dt;
        if (this.blinkTimer <= 0) {
          this.isSlowBlinking = this.purrLevel > 0.35;
          this.blinkTimer = this.isSlowBlinking ? 2.6 + Math.random() * 1.5 : 3.2 + Math.random() * 3.5;
          this.blinkAmount = 1.0;
        }
        const blinkDecayRate = this.isSlowBlinking ? 1.8 : 7.5;
        this.blinkAmount = Math.max(0, this.blinkAmount - dt * blinkDecayRate);

        let eyeClosure = Math.sin(this.blinkAmount * Math.PI);
        if (this.currentBehavior === 'sleep') {
          eyeClosure = 0.98;
        } else if (this.purrLevel > 0.25) {
          // Content half-closed purr squint
          eyeClosure = Math.max(eyeClosure, this.purrLevel * 0.62);
        }

        for (const eyeGrp of [this.leftEyeGroup, this.rightEyeGroup]) {
          const { upperLid, lowerLid } = eyeGrp.userData;
          const showLids = eyeClosure > 0.04;
          upperLid.visible = showLids;
          lowerLid.visible = showLids;
          if (showLids) {
            upperLid.scale.y = THREE.MathUtils.lerp(0.06, 1.04, eyeClosure);
            lowerLid.scale.y = THREE.MathUtils.lerp(0.06, 1.04, eyeClosure);
          }
        }

        // 7. Jaw, Meow, Grooming & Nose-Lick Tongue Animation
        let jawOpen = 0.0;
        let showTongue = false;
        let tongueZ = 0.072;
        let tonguePitch = 0;

        if (this.meowTimer > 0) {
          this.meowTimer -= dt;
          jawOpen = Math.sin((this.meowTimer / 0.72) * Math.PI) * 0.42;
          showTongue = true;
        } else if (this.noseLickTimer > 0) {
          this.noseLickTimer -= dt;
          const phase = Math.sin((1 - this.noseLickTimer / 0.85) * Math.PI);
          jawOpen = 0.22 * phase;
          showTongue = true;
          tongueZ = 0.072 + phase * 0.042;
          tonguePitch = -0.65 * phase;
        } else if (this.currentBehavior === 'groom' || this.currentBehavior === 'eat') {
          const lick = Math.max(0, Math.sin(time * 7.5));
          jawOpen = lick * 0.28;
          showTongue = lick > 0.15;
          tongueZ = 0.072 + lick * 0.036;
          tonguePitch = -0.35 * lick;
        }

        this.jawGroup.rotation.x = jawOpen;
        this.tongueMesh.visible = showTongue;
        this.tongueMesh.position.z = tongueZ;
        this.tongueMesh.rotation.x = tonguePitch;

        // 8. Independent Ear Muscle Swivel & Twitches
        this.earTwitchL = Math.max(0, this.earTwitchL - dt * 3.5);
        this.earTwitchR = Math.max(0, this.earTwitchR - dt * 3.5);
        if (Math.random() < dt * 0.45) this.earTwitchL = 0.35;
        if (Math.random() < dt * 0.45) this.earTwitchR = 0.35;

        const airplaneEars = (isCrouching || this.petZone === 'head') ? 0.38 : 0;
        this.leftEarGroup.rotation.set(
          0.16 - airplaneEars * 0.3,
          0.22 + targetHeadYaw * 0.25 + this.earTwitchL * 0.35,
          -0.32 - airplaneEars * 0.55 - this.earTwitchL * 0.25
        );
        this.rightEarGroup.rotation.set(
          0.16 - airplaneEars * 0.3,
          -0.22 + targetHeadYaw * 0.25 - this.earTwitchR * 0.35,
          0.32 + airplaneEars * 0.55 + this.earTwitchR * 0.25
        );

        // 9. Four-Legged Articulated Kinematics (Walk Gait, Sit, Stretch, Groom, Knead, Loaf)
        this.updateLimbs(time, isWalking, isCrouching);

        // 10. 16-Segment Harmonic Tail Wave
        this.updateTail(time, isWalking, isCrouching);
      }

      updateLimbs(time, isWalking, isCrouching) {
        const fl = this.frontLeftLeg;
        const fr = this.frontRightLeg;
        const bl = this.backLeftLeg;
        const br = this.backRightLeg;

        // Front Left & Right Base Anchor Positions (tucked cleanly into muscular chest/shoulders)
        const frontZ = THREE.MathUtils.lerp(0.32, 0.21, this.sitBlend) + this.stretchBlend * 0.16;
        const frontY = THREE.MathUtils.lerp(0.37, 0.37, this.sitBlend) - this.stretchBlend * 0.15 - this.loafBlend * 0.18;
        fl.group.position.set(0.088, frontY, frontZ);
        fr.group.position.set(-0.088, frontY, frontZ);

        // Hind Left & Right Base Anchor Positions (tucked cleanly into pelvis/haunches)
        const backZ = THREE.MathUtils.lerp(-0.33, -0.20, this.sitBlend) - this.stretchBlend * 0.12;
        const backY = THREE.MathUtils.lerp(0.39, 0.20, this.sitBlend) - this.loafBlend * 0.20;
        bl.group.position.set(0.096, backY, backZ);
        br.group.position.set(-0.096, backY, backZ);

        // Claws extension (extend when kneading biscuits, stretching, or pouncing!)
        const extendClaws = (this.purrLevel > 0.45 || this.stretchBlend > 0.4 || isCrouching) ? 1.0 : 0.2;
        for (const leg of [fl, fr]) {
          for (const claw of leg.paw.claws) {
            claw.scale.setScalar(extendClaws);
          }
        }

        if (isWalking) {
          // 4-Beat Feline Diagonal Gait Cycle with Knee/Elbow/Wrist Flexion
          const pFL = this.gaitPhase;
          const pFR = this.gaitPhase + Math.PI;
          const pBL = this.gaitPhase + Math.PI * 0.5;
          const pBR = this.gaitPhase + Math.PI * 1.5;

          const applyForeStep = (leg, phase) => {
            const swing = Math.sin(phase);
            const lift = Math.max(0, Math.cos(phase));
            leg.group.rotation.x = 0.06 + swing * 0.42;
            leg.elbowGroup.rotation.x = -0.10 - lift * 0.65;
            leg.wristGroup.rotation.x = 0.04 + lift * 0.45 - swing * 0.2;
            leg.group.rotation.z = 0;
          };

          const applyHindStep = (leg, phase) => {
            const swing = Math.sin(phase);
            const lift = Math.max(0, Math.cos(phase));
            leg.group.rotation.x = -0.24 + swing * 0.38;
            leg.kneeGroup.rotation.x = 0.62 + lift * 0.55;
            leg.hockGroup.rotation.x = -0.38 - lift * 0.48 - swing * 0.18;
          };

          applyForeStep(fl, pFL);
          applyForeStep(fr, pFR);
          applyHindStep(bl, pBL);
          applyHindStep(br, pBR);
          return;
        }

        // Stationary Poses: Standing, Sitting, Grooming, Feather Batting, Loafing, Stretching, Belly Roll
        // Forelegs (note: for bone along -Y, negative rotation.x swings forward +Z, positive swings back -Z)
        let flShoulderX = 0.06 * (1 - this.sitBlend) - 0.03 * this.sitBlend - 0.68 * this.stretchBlend + 1.15 * this.loafBlend;
        let frShoulderX = flShoulderX;
        let flElbowX = -0.10 * (1 - this.sitBlend) + 0.03 * this.sitBlend + 0.42 * this.stretchBlend - 2.35 * this.loafBlend;
        let frElbowX = flElbowX;
        let flWristX = 0.04 * (1 - this.sitBlend) + 0.26 * this.stretchBlend + 1.20 * this.loafBlend;
        let frWristX = flWristX;
        let frShoulderZ = 0;

        // "Making Biscuits" (Kneading paws rhythmically when purring!)
        if (this.purrLevel > 0.35 && this.loafBlend < 0.5 && this.currentBehavior !== 'groom') {
          const kneadL = Math.max(0, Math.sin(time * 4.2));
          const kneadR = Math.max(0, Math.sin(time * 4.2 + Math.PI));
          flShoulderX -= kneadL * 0.18;
          flElbowX -= kneadL * 0.32;
          frShoulderX -= kneadR * 0.18;
          frElbowX -= kneadR * 0.32;
        }

        // Grooming: Right forepaw raised to face and rubbing cheek/ear
        if (this.currentBehavior === 'groom') {
          frShoulderX = -1.15 + Math.sin(time * 6.5) * 0.18;
          frElbowX = -0.82;
          frWristX = -0.45;
          frShoulderZ = -0.28;
        } else if (this.currentBehavior === 'feather') {
          // Batting at dangling feather wand!
          const bat = Math.sin(time * 9.5);
          frShoulderX = -1.25 + bat * 0.35;
          frElbowX = -0.45 - bat * 0.25;
          frShoulderZ = -0.15;
        }

        fl.group.rotation.set(flShoulderX, 0, 0);
        fl.elbowGroup.rotation.set(flElbowX, 0, 0);
        fl.wristGroup.rotation.set(flWristX, 0, 0);

        fr.group.rotation.set(frShoulderX, 0, frShoulderZ);
        fr.elbowGroup.rotation.set(frElbowX, 0, 0);
        fr.wristGroup.rotation.set(frWristX, 0, 0);

        // Hindlegs: coaxial femur -> crus -> metatarsus -> paw
        const fold = Math.max(this.sitBlend, this.loafBlend);
        const hindHipX = THREE.MathUtils.lerp(-0.24, -0.92, fold) + 0.35 * this.stretchBlend;
        const hindKneeX = THREE.MathUtils.lerp(0.62, 2.15, fold) - 0.25 * this.stretchBlend;
        const hindHockX = THREE.MathUtils.lerp(-0.38, -1.25, fold) - 0.10 * this.stretchBlend;
        const hindPawX = THREE.MathUtils.lerp(0.0, -1.45, fold);

        bl.group.rotation.set(hindHipX, 0.06 * fold, 0);
        bl.kneeGroup.rotation.set(hindKneeX, 0, 0);
        bl.hockGroup.rotation.set(hindHockX, 0, 0);
        bl.paw.pawGroup.rotation.x = hindPawX;

        br.group.rotation.set(hindHipX, -0.06 * fold, 0);
        br.kneeGroup.rotation.set(hindKneeX, 0, 0);
        br.hockGroup.rotation.set(hindHockX, 0, 0);
        br.paw.pawGroup.rotation.x = hindPawX;
      }

      updateTail(time, isWalking, isCrouching) {
        // Position tail root at rear of deformed spine
        const tailY = THREE.MathUtils.lerp(0.49, 0.18, this.sitBlend) + this.stretchBlend * 0.06 - this.loafBlend * 0.24;
        const tailZ = THREE.MathUtils.lerp(-0.45, -0.28, this.sitBlend) - this.stretchBlend * 0.05 + this.loafBlend * 0.05;
        this.tailRoot.position.set(0, tailY, tailZ);

        const count = this.tailSegments.length;
        for (let i = 0; i < count; i++) {
          const t = i / (count - 1);
          const seg = this.tailSegments[i].pivot;

          if (this.currentBehavior === 'sleep' || this.currentBehavior === 'loaf') {
            // Curl tail snugly around the right flank
            seg.rotation.x = i === 0 ? -0.15 : 0.02;
            seg.rotation.y = 0.21 + Math.sin(time * 1.4 + t * 3) * 0.015;
            seg.rotation.z = 0;
          } else if (isWalking) {
            // Upright happy "question mark" tail with gentle sway
            const baseLift = i < 4 ? 0.34 : (i > 11 ? -0.18 : 0.03);
            seg.rotation.x = baseLift;
            seg.rotation.y = Math.sin(this.gaitPhase - t * 2.4) * (0.04 + t * 0.08);
            seg.rotation.z = 0;
          } else if (isCrouching || this.petZone === 'tail') {
            // Excited hunting tail twitch at tip
            seg.rotation.x = i === 0 ? -0.1 : 0.03;
            seg.rotation.y = Math.sin(time * 11.0 - t * 4.2) * (0.04 + t * 0.18);
          } else {
            // Graceful sitting/idle sine wave
            const lift = i === 0 ? -0.22 * this.sitBlend + 0.18 * (1 - this.sitBlend) : 0.04 + Math.sin(time * 1.6 - t * 3.0) * 0.04;
            const sway = Math.sin(time * 2.1 - t * 3.5) * (0.05 + t * 0.11);
            seg.rotation.x = lift;
            seg.rotation.y = sway + (this.sitBlend * 0.08);
          }
        }
      }
    }

    const cat = new RealisticCat(scene);

    function createYarnBall() {

        torus.rotation.set(i * 0.7, i * 1.1, i * 0.4);
        group.add(torus);

      group.position.copy(worldState.yarnPos);
      scene.add(group);
      return group;
    }

    // ============================================================================

    const raycaster = new THREE.Raycaster();

    function updatePointerRay(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      audio.init();
      isPointerDown = true;
      updatePointerRay(e);

      if (worldState.activeTool === 'pet') {
        const hits = raycaster.intersectObjects(cat.interactableMeshes, false);
        if (hits.length > 0) {
          controls.enabled = false;
          const zone = hits[0].object.userData.zone || 'back';
          handlePettingHit(zone, hits[0].point, true);
        }
      } else if (worldState.activeTool === 'yarn') {
        const floorHits = raycaster.intersectObjects([floorMesh, rugMesh], false);
        if (floorHits.length > 0) {
          const pt = floorHits[0].point;
          worldState.yarnPos.set(pt.x, 0.095, pt.z);
          const dir = new THREE.Vector3().subVectors(cat.position, worldState.yarnPos).normalize();
          worldState.yarnVel.set(dir.x * 1.4 + (Math.random() - 0.5) * 0.8, 0, dir.z * 1.4 + (Math.random() - 0.5) * 0.8);
          showToast('🧶 Tossed the yarn ball! Watch the cat chase it!');

      } else if (worldState.activeTool === 'treat') {
        const floorHits = raycaster.intersectObjects([floorMesh, rugMesh], false);
        if (floorHits.length > 0) {
          const pt = floorHits[0].point;
          treatMesh.position.set(pt.x, 0.025, pt.z);
          treatMesh.visible = true;
          worldState.activeTreat = treatMesh;

    window.addEventListener('pointerup', () => {
      isPointerDown = false;
      controls.enabled = true;

    renderer.domElement.addEventListener('pointermove', (e) => {
      updatePointerRay(e);

      if (worldState.activeTool === 'laser') {
        const hits = raycaster.intersectObjects([floorMesh, rugMesh, treeBase, treePerch], false);
        if (hits.length > 0) {
          worldState.laserActive = true;
          worldState.laserPoint.copy(hits[0].point);
          laserGroup.position.copy(hits[0].point);
          laserGroup.visible = true;

        return;

      if (worldState.activeTool === 'feather') {
        const hits = raycaster.intersectObjects([floorMesh, rugMesh], false);
        if (hits.length > 0) {
          worldState.featherActive = true;
          featherGroup.position.set(
            cat.position.x + Math.sin(cat.heading) * 0.42 + Math.sin(performance.now() * 0.008) * 0.14,
            0.48 + Math.cos(performance.now() * 0.01) * 0.08,
            cat.position.z + Math.cos(cat.heading) * 0.42
          );
          featherGroup.visible = true;
          cat.lookTarget.copy(featherGroup.position);
        }
        return;
      }

      // Default Pet & Scratch mode + natural eye/head tracking toward hovered cursor
      const catHits = raycaster.intersectObjects(cat.interactableMeshes, false);
      if (catHits.length > 0) {
        const zone = catHits[0].object.userData.zone || 'back';
        if (isPointerDown) {
          handlePettingHit(zone, catHits[0].point, false);
        }
      } else if (!isPointerDown) {
        const floorHits = raycaster.intersectObjects([floorMesh, rugMesh], false);
        if (floorHits.length > 0 && cat.currentBehavior === 'sit') {
          const p = floorHits[0].point;
          cat.lookTarget.set(p.x, 0.45, p.z);

    });

    function handlePettingHit(zone, hitPoint, isClick) {
      if (zone === 'nose' && isClick) {
        cat.triggerBoop();
        spawnHeartParticle(hitPoint);
        showToast('👉 Boop! Nose lick & chirp!');
        return;

      cat.petZone = zone;
      cat.petDecayTimer = 0.65;

      const now = performance.now();
      if (now - lastHeartSpawn > 280) {
        spawnHeartParticle(hitPoint);
        lastHeartSpawn = now;

      const messages = {
        chin: '🥰 Blissful chin & cheek scratches! Purring deeply...',
        head: '✨ Warm head pats! Slow-blinking with affection...',
        ears: '🐾 Gently scratching behind the ears!',

        belly: '💖 Belly rubs! Maximum feline trust!',

    // ============================================================================
    // 7. MAIN ANIMATION & PHYSICS LOOP
    // ============================================================================
    const clock = new THREE.Clock();
    const stateLabels = {
      sit: 'Curious & Alert',
      walk: 'Prowling Room',
      laser: 'Hunting Laser! 🔴',
      chase_yarn: 'Chasing Yarn! 🧶',
      feather: 'Batting Feather! 🪶',
      eat: 'Enjoying Salmon 🐟',
      stretch: 'Big Feline Stretch',
      groom: 'Grooming Paw 👅',
      loaf: 'Cozy Cat Loaf 🍞',
      sleep: 'Purring & Napping 💤',
      belly: 'Happy Belly Roll 🥰'
    };

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      // Update Yarn Ball Physics
      if (worldState.yarnVel.lengthSq() > 0.0004) {
        worldState.yarnMoving = true;
        worldState.yarnPos.addScaledVector(worldState.yarnVel, dt);
        worldState.yarnVel.multiplyScalar(Math.pow(0.28, dt)); // Carpet friction

        // Keep within circular rug area
        const r = Math.hypot(worldState.yarnPos.x, worldState.yarnPos.z);
        if (r > 2.2) {
          worldState.yarnPos.multiplyScalar(2.2 / r);
          worldState.yarnVel.negate().multiplyScalar(0.6);
        }
        yarnBall.position.copy(worldState.yarnPos);
        yarnBall.rotation.x += worldState.yarnVel.z * dt * 10;
        yarnBall.rotation.z -= worldState.yarnVel.x * dt * 10;
      } else {
        worldState.yarnMoving = false;
      }

      // Check Treat Consumption
      if (worldState.activeTreat && worldState.eatProgress > 1.8) {
        treatMesh.visible = false;
        worldState.activeTreat = null;
        worldState.eatProgress = 0;
        cat.affection = Math.min(1.0, cat.affection + 0.12);
        cat.purrLevel = Math.min(1.0, cat.purrLevel + 0.6);
        cat.currentBehavior = 'sit';
        spawnHeartParticle(cat.position.clone().add(new THREE.Vector3(0, 0.7, 0)));
        showToast('😋 Treat finished! Happy purring cat!');
      }

      // Update Cat Anatomy & Behavior
      cat.update(dt, time, worldState);

      // Camera Follow Mode
      if (cameraMode === 'follow') {
        const targetFocus = new THREE.Vector3(cat.position.x, 0.55, cat.position.z);
        controls.target.lerp(targetFocus, Math.min(1, dt * 5));
      }

      // Animate Floating Heart Sprites
      for (let i = heartSprites.length - 1; i >= 0; i--) {
        const h = heartSprites[i];
        h.age += dt;
        h.sprite.position.y += dt * 0.42;
        h.sprite.position.x += Math.sin(h.age * 6 + i) * dt * 0.08;
        h.sprite.material.opacity = Math.max(0, 1 - h.age / 1.4);
        if (h.age >= 1.4) {
          scene.remove(h.sprite);
          h.sprite.material.dispose();
          heartSprites.splice(i, 1);
        }
      }

      // Gently drift sunbeam dust motes
      const dPos = dustGeo.attributes.position.array;
      for (let i = 0; i < dustCount; i++) {
        dPos[i * 3 + 1] += Math.sin(time * 0.6 + i) * 0.0008;
        dPos[i * 3] += Math.cos(time * 0.4 + i * 0.5) * 0.0006;
      }
      dustGeo.attributes.position.needsUpdate = true;

      // Update HUD Meters
      document.getElementById('cat-state-badge').textContent =
        cat.petZone ? `Loving ${cat.petZone} scratches!` : (stateLabels[cat.currentBehavior] || 'Curious & Alert');
      document.getElementById('affection-val').textContent = `${Math.round(cat.affection * 100)}%`;
      document.getElementById('affection-bar').style.width = `${Math.round(cat.affection * 100)}%`;
      const purrHz = cat.purrLevel > 0.05 ? `${(25.2 + cat.purrLevel * 1.6).toFixed(1)} Hz` : '0 Hz';
      document.getElementById('purr-val').textContent = purrHz;
      document.getElementById('purr-bar').style.width = `${Math.round(cat.purrLevel * 100)}%`;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
