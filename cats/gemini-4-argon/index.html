<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Felis 3D — Realistic Interactive Three.js Cat</title>
  <style>
    :root {
      --bg-glass: rgba(18, 20, 26, 0.76);
      --bg-glass-strong: rgba(14, 16, 22, 0.88);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --accent-rose: #fb7185;
      --accent-emerald: #34d399;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141210;
      font-family: var(--font-sans);
      color: var(--text-main);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas-container.mode-pet {
      cursor: pointer;
    }
    #canvas-container.mode-laser {
      cursor: crosshair;
    }
    #canvas-container.mode-yarn,
    #canvas-container.mode-treat {
      cursor: copy;
    }

    /* Top Header & Status HUD */
    .hud-top {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 20;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-card {
      pointer-events: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    }

    .brand-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.16);
      color: var(--accent-emerald);
      border: 1px solid rgba(52, 211, 153, 0.35);
    }

    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Vitals & Mood Meters */
    .vitals-card {
      pointer-events: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      gap: 18px;
      align-items: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    .meter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 110px;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .meter-label span.val {
      color: var(--text-main);
    }

    .meter-bar {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .meter-fill.affection {
      background: linear-gradient(90deg, #f43f5e, #fb7185);
      box-shadow: 0 0 10px rgba(251, 113, 133, 0.5);
    }
    .meter-fill.energy {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
    }
    .meter-fill.purr {
      background: linear-gradient(90deg, #10b981, #34d399);
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }
    .sound-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.28);
    }
    .sound-btn.active {
      background: rgba(52, 211, 153, 0.18);
      border-color: rgba(52, 211, 153, 0.45);
      color: #6ee7b7;
    }

    /* Right Side Customization & Pose Panel */
    .side-panel {
      position: fixed;
      top: 90px;
      right: 16px;
      width: 280px;
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 14px;
      z-index: 20;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .chip-grid.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--text-main);
      padding: 7px 9px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chip-btn:hover {
      background: rgba(255, 255, 255, 0.13);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .chip-btn.active {
      background: rgba(245, 158, 11, 0.22);
      border-color: var(--accent);
      color: #fde68a;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.4);
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Bottom Interactive Tool Dock */
    .bottom-dock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-glass-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 9px 14px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.18s ease;
    }

    .tool-btn .icon {
      font-size: 17px;
    }

    .tool-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.07);
    }

    .tool-btn.active {
      color: #fff;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.28), rgba(234, 88, 12, 0.28));
      border-color: rgba(245, 158, 11, 0.65);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.25);
    }

    .dock-divider {
      width: 1px;
      height: 26px;
      background: var(--border-glass);
      margin: 0 2px;
    }

    /* Floating Feedback Toast / Zone Indicator */
    #interaction-toast {
      position: fixed;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 12.5px;
      color: #fde68a;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    #interaction-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    @media (max-width: 820px) {
      .side-panel {
        width: 230px;
        top: 84px;
        padding: 10px;
      }
      .vitals-card {
        display: none;
      }
      .tool-btn span.label {
        display: none;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container" class="mode-pet"></div>

  <!-- Top HUD -->
  <div class="hud-top">
    <div class="brand-card">
      <div class="brand-icon">🐈</div>
      <div class="brand-text">
        <h1>
          Felis 3D
          <span class="status-pill" id="cat-state-badge">Curious &amp; Alert</span>
        </h1>
        <p id="hint-subtitle">Stroke head, chin, or back to purr • Click nose to boop • Switch tools below</p>
      </div>
    </div>

    <div class="vitals-card">
      <div class="meter-group">
        <div class="meter-label">
          <span>Affection</span>
          <span class="val" id="affection-val">78%</span>
        </div>
        <div class="meter-bar">
          <div class="meter-fill affection" id="affection-bar" style="width: 78%"></div>
        </div>
      </div>

      <div class="meter-group">
        <div class="meter-label">
          <span>Purr Intensity</span>
          <span class="val" id="purr-val">0 Hz</span>
        </div>
        <div class="meter-bar">
          <div class="meter-fill purr" id="purr-bar" style="width: 0%"></div>
        </div>
      </div>

      <div class="meter-group">
        <div class="meter-label">
          <span>Playfulness</span>
          <span class="val" id="energy-val">85%</span>
        </div>
        <div class="meter-bar">
          <div class="meter-fill energy" id="energy-bar" style="width: 85%"></div>
        </div>
      </div>

      <button class="sound-btn active" id="btn-audio-toggle" title="Toggle WebAudio Synthesized Purr &amp; Meow">
        <span id="audio-icon">🔊</span>
        <span id="audio-label">Audio On</span>
      </button>
    </div>
  </div>

  <!-- Right Control Panel -->
  <aside class="side-panel">
    <div class="panel-section">
      <div class="section-title">
        <span>Coat &amp; Breed</span>
      </div>
      <div class="chip-grid" id="coat-selector">
        <button class="chip-btn active" data-coat="ginger">
          <span class="swatch" style="background: linear-gradient(135deg, #e07428, #f7b267)"></span>
          Ginger Tabby
        </button>
        <button class="chip-btn" data-coat="silver">
          <span class="swatch" style="background: linear-gradient(135deg, #4b5563, #cbd5e1)"></span>
          Silver Tabby
        </button>
        <button class="chip-btn" data-coat="siamese">
          <span class="swatch" style="background: linear-gradient(135deg, #f3e5d0, #3b2618)"></span>
          Siamese
        </button>
        <button class="chip-btn" data-coat="tuxedo">
          <span class="swatch" style="background: linear-gradient(135deg, #18181b, #f8fafc)"></span>
          Tuxedo
        </button>
        <button class="chip-btn" data-coat="calico">
          <span class="swatch" style="background: linear-gradient(135deg, #e07428, #1f2937, #fff)"></span>
          Calico
        </button>
        <button class="chip-btn" data-coat="russian">
          <span class="swatch" style="background: linear-gradient(135deg, #475569, #94a3b8)"></span>
          British Blue
        </button>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">
        <span>Eye Pigmentation</span>
      </div>
      <div class="chip-grid cols-3" id="eye-selector">
        <button class="chip-btn active" data-eye="emerald">
          <span class="swatch" style="background: #22c55e"></span>Emerald
        </button>
        <button class="chip-btn" data-eye="amber">
          <span class="swatch" style="background: #f59e0b"></span>Amber
        </button>
        <button class="chip-btn" data-eye="sapphire">
          <span class="swatch" style="background: #38bdf8"></span>Sapphire
        </button>
        <button class="chip-btn" data-eye="copper">
          <span class="swatch" style="background: #ea580c"></span>Copper
        </button>
        <button class="chip-btn" data-eye="odd">
          <span class="swatch" style="background: linear-gradient(90deg, #38bdf8 50%, #f59e0b 50%)"></span>Odd-Eye
        </button>
        <button class="chip-btn" data-eye="hazel">
          <span class="swatch" style="background: #84cc16"></span>Hazel
        </button>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">
        <span>Behavior &amp; Pose</span>
      </div>
      <div class="chip-grid" id="pose-selector">
        <button class="chip-btn active" data-pose="auto">✨ Auto AI</button>
        <button class="chip-btn" data-pose="sit">🐾 Sit &amp; Watch</button>
        <button class="chip-btn" data-pose="walk">🐈 Walk / Prowl</button>
        <button class="chip-btn" data-pose="stretch">🧘 Big Stretch</button>
        <button class="chip-btn" data-pose="groom">👅 Groom Paw</button>
        <button class="chip-btn" data-pose="loaf">🍞 Cat Loaf</button>
        <button class="chip-btn" data-pose="sleep">💤 Curl &amp; Nap</button>
        <button class="chip-btn" data-pose="belly">🥰 Belly Roll</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">
        <span>Physiology &amp; Details</span>
      </div>
      <div class="slider-row">
        <span>Pupil Slit / Dilate</span>
        <input type="range" id="pupil-slider" min="0" max="100" value="32" />
      </div>
      <div class="chip-grid" style="margin-top: 2px;">
        <button class="chip-btn active" id="btn-toggle-collar">🔔 Collar &amp; Bell</button>
        <button class="chip-btn" id="btn-trigger-meow">🔊 Meow / Trill</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">
        <span>Camera &amp; Lighting</span>
      </div>
      <div class="chip-grid cols-3" id="camera-selector">
        <button class="chip-btn active" data-cam="overview">Overview</button>
        <button class="chip-btn" data-cam="face">Face Macro</button>
        <button class="chip-btn" data-cam="follow">Follow</button>
      </div>
      <div class="chip-grid cols-3" id="light-selector" style="margin-top: 4px;">
        <button class="chip-btn active" data-light="sunlit">☀️ Sunlit</button>
        <button class="chip-btn" data-light="golden">🌅 Sunset</button>
        <button class="chip-btn" data-light="cozy">🕯️ Cozy</button>
      </div>
    </div>
  </aside>

  <!-- Floating Toast -->
  <div id="interaction-toast">Chin scratches! Purring at 26 Hz...</div>

  <!-- Bottom Interactive Tool Dock -->
  <nav class="bottom-dock">
    <button class="tool-btn active" data-tool="pet">
      <span class="icon">🤚</span>
      <span class="label">Pet &amp; Scratch</span>
    </button>
    <button class="tool-btn" data-tool="laser">
      <span class="icon">🔴</span>
      <span class="label">Laser Pointer</span>
    </button>
    <button class="tool-btn" data-tool="yarn">
      <span class="icon">🧶</span>
      <span class="label">Toss Yarn Ball</span>
    </button>
    <button class="tool-btn" data-tool="feather">
      <span class="icon">🪶</span>
      <span class="label">Feather Wand</span>
    </button>
    <button class="tool-btn" data-tool="treat">
      <span class="icon">🐟</span>
      <span class="label">Drop Treat</span>
    </button>
    <div class="dock-divider"></div>
    <button class="tool-btn" id="btn-call-cat" title="Call cat over to center">
      <span class="icon">📣</span>
      <span class="label">Pspsps!</span>
    </button>
  </nav>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ============================================================================
    // 1. PROCEDURAL WEBAUDIO FELINE VOCAL & PURR SYNTHESIZER
    // ============================================================================
    class FelineAudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.purrGain = null;
        this.purrOsc1 = null;
        this.purrOsc2 = null;
        this.purrNoiseGain = null;
        this.purrIntensity = 0;
        this.initialized = false;
      }

      init() {
        if (this.initialized) {
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return;
        }
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          this.ctx = new AudioCtx();

          // Continuous Purr Generator (26.5 Hz fundamental + 53 Hz harmonic + breath noise)
          this.purrGain = this.ctx.createGain();
          this.purrGain.gain.value = 0.0;

          const purrFilter = this.ctx.createBiquadFilter();
          purrFilter.type = 'lowpass';
          purrFilter.frequency.value = 145;
          purrFilter.Q.value = 3.2;

          this.purrOsc1 = this.ctx.createOscillator();
          this.purrOsc1.type = 'sawtooth';
          this.purrOsc1.frequency.value = 26.2;

          this.purrOsc2 = this.ctx.createOscillator();
          this.purrOsc2.type = 'triangle';
          this.purrOsc2.frequency.value = 52.4;

          const osc2Gain = this.ctx.createGain();
          osc2Gain.gain.value = 0.45;

          this.purrOsc1.connect(purrFilter);
          this.purrOsc2.connect(osc2Gain);
          osc2Gain.connect(purrFilter);
          purrFilter.connect(this.purrGain);
          this.purrGain.connect(this.ctx.destination);

          this.purrOsc1.start();
          this.purrOsc2.start();
          this.initialized = true;
        } catch (e) {
          // WebAudio blocked or unavailable
        }
      }

      updatePurr(dt, targetIntensity, time) {
        this.purrIntensity += (targetIntensity - this.purrIntensity) * Math.min(1, dt * 4.0);
        if (!this.initialized || !this.enabled || !this.ctx) return;

        // Rhythmic inhale/exhale respiratory modulation of feline purr (~0.42 Hz breath cycle)
        const breathCycle = 0.55 + 0.45 * Math.sin(time * 2.7) * Math.sin(time * 1.35 + 0.4);
        const flutter = 0.85 + 0.15 * Math.sin(time * 26.2 * Math.PI * 2);
        const level = this.purrIntensity * breathCycle * flutter * 0.16;

        this.purrGain.gain.setTargetAtTime(Math.max(0, level), this.ctx.currentTime, 0.05);
        this.purrOsc1.frequency.setTargetAtTime(25.5 + 1.8 * Math.sin(time * 2.7), this.ctx.currentTime, 0.08);
      }

      playMeow(style = 'meow') {
        this.init();
        if (!this.initialized || !this.enabled || !this.ctx) return;

        const now = this.ctx.currentTime;
        const dur = style === 'chirp' ? 0.28 : style === 'trill' ? 0.48 : 0.68;

        const osc = this.ctx.createOscillator();
        const subOsc = this.ctx.createOscillator();
        const env = this.ctx.createGain();

        // Feline vocal tract formant filters (F1 ~ 850Hz, F2 ~ 1700Hz)
        const formant1 = this.ctx.createBiquadFilter();
        formant1.type = 'bandpass';
        formant1.Q.value = 3.8;

        const formant2 = this.ctx.createBiquadFilter();
        formant2.type = 'peaking';
        formant2.frequency.value = 1850;
        formant2.gain.value = 8;

        osc.type = 'sawtooth';
        subOsc.type = 'triangle';

        if (style === 'chirp') {
          // Cute upward "brrp!" when booped or alerted
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(760, now + 0.14);
          osc.frequency.exponentialRampToValueAtTime(610, now + dur);
          formant1.frequency.setValueAtTime(900, now);
          formant1.frequency.linearRampToValueAtTime(1450, now + dur);
        } else if (style === 'trill') {
          osc.frequency.setValueAtTime(390, now);
          for (let i = 0; i < 6; i++) {
            osc.frequency.linearRampToValueAtTime(520 + (i % 2) * 90, now + (i + 1) * (dur / 6));
          }
          formant1.frequency.setValueAtTime(1100, now);
        } else {
          // Classic expressive "Meee-oww" pitch contour
          osc.frequency.setValueAtTime(380, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + dur * 0.28);
          osc.frequency.exponentialRampToValueAtTime(510, now + dur * 0.65);
          osc.frequency.exponentialRampToValueAtTime(340, now + dur);

          formant1.frequency.setValueAtTime(720, now);
          formant1.frequency.linearRampToValueAtTime(1350, now + dur * 0.32);
          formant1.frequency.linearRampToValueAtTime(680, now + dur);
        }

        subOsc.frequency.setValueAtTime(280, now);
        subOsc.frequency.exponentialRampToValueAtTime(320, now + dur);

        env.gain.setValueAtTime(0.0001, now);
        env.gain.exponentialRampToValueAtTime(0.11, now + 0.05);
        env.gain.setValueAtTime(0.09, now + dur * 0.6);
        env.gain.exponentialRampToValueAtTime(0.0001, now + dur);

        osc.connect(formant1);
        subOsc.connect(formant1);
        formant1.connect(formant2);
        formant2.connect(env);
        env.connect(this.ctx.destination);

        osc.start(now);
        subOsc.start(now);
        osc.stop(now + dur + 0.02);
        subOsc.stop(now + dur + 0.02);
      }

      playBellJingle(intensity = 0.5) {
        if (!this.initialized || !this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const env = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(3150 + Math.random() * 220, now);
        env.gain.setValueAtTime(0.0001, now);
        env.gain.exponentialRampToValueAtTime(0.018 * intensity, now + 0.008);
        env.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
        osc.connect(env);
        env.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    // Shared Fur Normal & Roughness Maps (generated once at startup)
    function createFurNormalAndRoughnessMaps() {
      const size = 1024;

      nctx.fillStyle = 'rgb(128, 128, 255)';
      nctx.fillRect(0, 0, size, size);

      rctx.fillStyle = 'rgb(175, 175, 175)';
      rctx.fillRect(0, 0, size, size);

      // Draw 32,000 directional micro-hair normal and roughness fibers
      for (let i = 0; i < 32000; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const len = 10 + Math.random() * 18;
        const angle = (Math.random() - 0.5) * 0.26;
        const nx = Math.floor(128 + (Math.random() - 0.5) * 75);
        const ny = Math.floor(128 + (Math.random() - 0.5) * 45);
        nctx.strokeStyle = `rgba(${nx}, ${ny}, 245, 0.38)`;
        nctx.lineWidth = 1.1 + Math.random() * 1.2;
        nctx.beginPath();
        nctx.moveTo(x, y);
        nctx.lineTo(x + Math.sin(angle) * len, y + Math.cos(angle) * len);
        nctx.stroke();

        const rv = Math.floor(135 + Math.random() * 90);
        rctx.strokeStyle = `rgba(${rv}, ${rv}, ${rv}, 0.25)`;
        rctx.lineWidth = 1.2;
        rctx.beginPath();
        rctx.moveTo(x, y);
        rctx.lineTo(x + Math.sin(angle) * len, y + Math.cos(angle) * len);
        rctx.stroke();
      }

      const normalMap = new THREE.CanvasTexture(normCanvas);
      normalMap.wrapS = THREE.RepeatWrapping;
      normalMap.wrapT = THREE.RepeatWrapping;
      normalMap.repeat.set(3, 3);

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = THREE.RepeatWrapping;
      roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.repeat.set(3, 3);

      return { normalMap, roughnessMap };
    }

    const furMaps = createFurNormalAndRoughnessMaps();

    function getCoatTexture(coatKey) {
      if (coatTextureCache.has(coatKey)) return coatTextureCache.get(coatKey);
      const preset = COAT_PRESETS[coatKey] || COAT_PRESETS.ginger;
      const size = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Base coat gradient
      const baseGrad = ctx.createLinearGradient(0, 0, size, size);
      baseGrad.addColorStop(0, preset.base);
      baseGrad.addColorStop(0.5, preset.secondary);
      baseGrad.addColorStop(1, preset.base);
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, size, size);

      // Pattern markings
      if (preset.pattern === 'tabby') {
        // Dorsal spine band & mackerel stripes
        ctx.fillStyle = preset.stripe;
        ctx.globalAlpha = 0.55;
        ctx.fillRect(size * 0.46, 0, size * 0.08, size);

        for (let s = 0; s < 16; s++) {
          const y = (s / 16) * size;
          ctx.beginPath();
          ctx.moveTo(0, y + 18);
          ctx.bezierCurveTo(size * 0.25, y - 22, size * 0.35, y + 32, size * 0.5, y);
          ctx.bezierCurveTo(size * 0.65, y + 32, size * 0.75, y - 22, size, y + 18);
          ctx.lineWidth = 18 + (s % 3) * 6;
          ctx.strokeStyle = preset.stripe;
          ctx.stroke();
        }
      } else if (preset.pattern === 'calico') {
        // Bold organic patches of rich orange tabby and charcoal black on white
        const patches = [
          { x: 0.22, y: 0.3, r: 0.24, c: '#d96b1f' },
          { x: 0.76, y: 0.25, r: 0.22, c: '#1c1d22' },
          { x: 0.64, y: 0.68, r: 0.25, c: '#d96b1f' },
          { x: 0.28, y: 0.75, r: 0.20, c: '#1c1d22' },
          { x: 0.50, y: 0.18, r: 0.16, c: '#e07b2d' },
          { x: 0.85, y: 0.82, r: 0.18, c: '#1c1d22' }
        ];
        for (const p of patches) {
          const g = ctx.createRadialGradient(p.x * size, p.y * size, p.r * size * 0.2, p.x * size, p.y * size, p.r * size);
          g.addColorStop(0, p.c);
          g.addColorStop(0.82, p.c);
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.globalAlpha = 0.92;
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x * size, p.y * size, p.r * size, 0, Math.PI * 2);
          ctx.fill();
        }

      // Belly / chest creamy-white underside region (mapped to outer UV edges)
      if (preset.pattern !== 'solid') {
        const bellyGradL = ctx.createLinearGradient(0, 0, size * 0.22, 0);
        bellyGradL.addColorStop(0, preset.bellyHex);
        bellyGradL.addColorStop(0.65, preset.bellyHex);
        bellyGradL.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.globalAlpha = preset.pattern === 'tuxedo' ? 0.98 : 0.85;
        ctx.fillStyle = bellyGradL;
        ctx.fillRect(0, 0, size * 0.22, size);

        const bellyGradR = ctx.createLinearGradient(size, 0, size * 0.78, 0);
        bellyGradR.addColorStop(0, preset.bellyHex);
        bellyGradR.addColorStop(0.65, preset.bellyHex);

        ctx.fillRect(size * 0.78, 0, size * 0.22, size);

      for (let i = 0; i < 24000; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const len = 8 + Math.random() * 15;

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.sin(angle) * len, y + Math.cos(angle) * len);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      coatTextureCache.set(coatKey, tex);
      return tex;
    }

    // Dynamic High-Realism Feline Eye Iris + Vertical Slit Pupil Texture
    function createEyeIrisTexture(colors, pupilDilation = 0.32) {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const update = (dilation) => {
        const cx = size / 2;
        const cy = size / 2;
        const r = size * 0.47;

        ctx.clearRect(0, 0, size, size);

        // Dark sclera / limbal ring border
        ctx.fillStyle = '#090b0e';
        ctx.fillRect(0, 0, size, size);

        const irisGrad = ctx.createRadialGradient(cx, cy, r * 0.12, cx, cy, r);
        irisGrad.addColorStop(0.0, colors[2]);
        irisGrad.addColorStop(0.38, colors[1]);
        irisGrad.addColorStop(0.82, colors[0]);
        irisGrad.addColorStop(0.95, '#0c120e');
        irisGrad.addColorStop(1.0, '#050708');

        ctx.fillStyle = irisGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        // Radial iris stroma fibers and crypts
        for (let i = 0; i < 220; i++) {
          const a = (i / 220) * Math.PI * 2;
          const wobble = Math.sin(i * 7.3) * 0.04;
          const rInner = r * (0.14 + (i % 5) * 0.03);
          const rOuter = r * (0.88 + (i % 3) * 0.03);
          ctx.strokeStyle = i % 2 === 0 ? colors[2] : colors[0];
          ctx.globalAlpha = 0.22 + (i % 4) * 0.06;
          ctx.lineWidth = 1.4 + (i % 3) * 0.8;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(a) * rInner, cy + Math.sin(a) * rInner);
          ctx.quadraticCurveTo(
            cx + Math.cos(a + wobble) * (r * 0.55),
            cy + Math.sin(a + wobble) * (r * 0.55),
            cx + Math.cos(a) * rOuter,
            cy + Math.sin(a) * rOuter
          );
          ctx.stroke();
        }
        ctx.globalAlpha = 1.0;

        // Collarette ring around pupil
        const pupilW = r * (0.09 + dilation * 0.62);
        const pupilH = r * (0.76 + dilation * 0.08);

        ctx.strokeStyle = colors[2];
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(cx, cy, pupilW * 1.28 + 6, pupilH * 1.04, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        // Vertical lenticular feline slit pupil (sharp top/bottom points when constricted, rounded when dilated)
        ctx.fillStyle = '#020204';
        ctx.beginPath();
        ctx.moveTo(cx, cy - pupilH);
        ctx.bezierCurveTo(
          cx + pupilW * 1.25, cy - pupilH * 0.45,
          cx + pupilW * 1.25, cy + pupilH * 0.45,
          cx, cy + pupilH
        );
        ctx.bezierCurveTo(
          cx - pupilW * 1.25, cy + pupilH * 0.45,
          cx - pupilW * 1.25, cy - pupilH * 0.45,
          cx, cy - pupilH
        );
        ctx.closePath();
        ctx.fill();

        // Subtle upper corneal shadow & crisp window reflection catchlight
        const shadowGrad = ctx.createLinearGradient(0, cy - r, 0, cy + r * 0.2);
        shadowGrad.addColorStop(0, 'rgba(0,0,0,0.45)');
        shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0.08)');
        shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = shadowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();

        // Catchlights
        ctx.fillStyle = 'rgba(255, 253, 245, 0.92)';
        ctx.beginPath();
        ctx.ellipse(cx - r * 0.28, cy - r * 0.28, r * 0.13, r * 0.09, -0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 253, 245, 0.55)';
        ctx.beginPath();
        ctx.arc(cx + r * 0.26, cy + r * 0.24, r * 0.05, 0, Math.PI * 2);
        ctx.fill();

        tex.needsUpdate = true;
      };

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      update(pupilDilation);
      return { texture: tex, update };
    }

    // ============================================================================
    // 4. ANATOMICALLY SCULPTED & RIGGED 3D CAT MODEL

    class RealisticCat {
      constructor(scene) {

      buildMaterials() {
        const preset = COAT_PRESETS[this.coatKey];

        // Shared reactive uniforms for 3D anatomical procedural coat shader
        this.coatUniforms = {
          uBaseColor: { value: new THREE.Color(preset.base) },
          uSecColor: { value: new THREE.Color(preset.secondary) },
          uStripeColor: { value: new THREE.Color(preset.stripe) },
          uBellyColor: { value: new THREE.Color(preset.bellyHex) },
          uPatternType: { value: 0 } // 0: tabby, 1: tuxedo, 2: siamese, 3: solid, 4: calico
        };

        const createAnatomicalFurMaterial = (partId, roughnessVal = 0.78) => {
          const mat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            normalMap: furMaps.normalMap,
            normalScale: new THREE.Vector2(0.45, 0.45),
            roughnessMap: furMaps.roughnessMap,
            roughness: roughnessVal,
            metalness: 0.01,
            sheen: 0.92,
            sheenRoughness: 0.38,
            sheenColor: new THREE.Color(0xfff5e6),
            clearcoat: 0.04,
            clearcoatRoughness: 0.65
          });

          mat.customProgramCacheKey = () => 'feline_fur_part_' + partId;
          mat.onBeforeCompile = (shader) => {
            shader.uniforms.uBaseColor = this.coatUniforms.uBaseColor;
            shader.uniforms.uSecColor = this.coatUniforms.uSecColor;
            shader.uniforms.uStripeColor = this.coatUniforms.uStripeColor;
            shader.uniforms.uBellyColor = this.coatUniforms.uBellyColor;
            shader.uniforms.uPatternType = this.coatUniforms.uPatternType;
            shader.uniforms.uPartId = { value: partId };

            shader.vertexShader = shader.vertexShader.replace(
              '#include <common>',
              `#include <common>
              varying vec3 vAnatPos;
              varying vec3 vAnatNormal;`
            );
            shader.vertexShader = shader.vertexShader.replace(
              '#include <begin_vertex>',
              `#include <begin_vertex>
              vAnatPos = position;
              vAnatNormal = normal;`
            );

            shader.fragmentShader = shader.fragmentShader.replace(
              '#include <common>',
              `#include <common>
              uniform vec3 uBaseColor;
              uniform vec3 uSecColor;
              uniform vec3 uStripeColor;
              uniform vec3 uBellyColor;
              uniform int uPatternType;
              uniform int uPartId;
              varying vec3 vAnatPos;
              varying vec3 vAnatNormal;

              float furHash(vec3 p) {
                p = fract(p * 0.3183099 + 0.1);
                p *= 17.0;
                return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
              }
              float furNoise(vec3 x) {
                vec3 i = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                return mix(
                  mix(mix(furHash(i + vec3(0,0,0)), furHash(i + vec3(1,0,0)), f.x),
                      mix(furHash(i + vec3(0,1,0)), furHash(i + vec3(1,1,0)), f.x), f.y),
                  mix(mix(furHash(i + vec3(0,0,1)), furHash(i + vec3(1,0,1)), f.x),
                      mix(furHash(i + vec3(0,1,1)), furHash(i + vec3(1,1,1)), f.x), f.y), f.z);
              }`
            );

            shader.fragmentShader = shader.fragmentShader.replace(
              '#include <color_fragment>',
              `#include <color_fragment>
              vec3 p = vAnatPos;
              float n1 = furNoise(p * 34.0);
              float n2 = furNoise(p * 95.0);
              float microStrand = (n1 * 0.65 + n2 * 0.35);

              // Base agouti fur blend with natural warm highlights
              vec3 furCol = mix(uBaseColor, uSecColor, clamp(0.35 + microStrand * 0.55 + vAnatNormal.y * 0.2, 0.0, 1.0));

              if (uPatternType == 0) {
                // TABBY (Ginger / Silver Mackerel)
                if (uPartId == 0) {
                  // Torso: use surface normal vAnatNormal so dorsal stripe, flank stripes & belly deform with spine!
                  float dorsal = exp(-abs(p.x) * 18.0) * smoothstep(0.35, 0.82, vAnatNormal.y);
                  float flankWave = sin(p.z * 28.0 + p.y * 8.0 + n1 * 2.2);
                  float flankMask = smoothstep(0.35, 0.88, flankWave) * smoothstep(0.25, 0.72, abs(vAnatNormal.x)) * smoothstep(-0.35, 0.25, vAnatNormal.y);
                  furCol = mix(furCol, uStripeColor, clamp(dorsal * 0.78 + flankMask * 0.68, 0.0, 0.88));

                  // Soft creamy chest bib & underbelly
                  float bellyMask = smoothstep(-0.22, -0.72, vAnatNormal.y);
                  float chestBib = smoothstep(0.24, 0.42, p.z) * smoothstep(0.25, 0.75, vAnatNormal.z) * smoothstep(0.22, -0.35, vAnatNormal.y) * smoothstep(0.14, 0.02, abs(p.x));
                  furCol = mix(furCol, uBellyColor, clamp(bellyMask * 0.88 + chestBib * 0.88, 0.0, 0.92));
                } else if (uPartId == 1) {
                  // Head: Forehead 'M' crown stripes, cheek tabby lines, and soft cream chin/whisker pads
                  float crownM = sin(abs(p.x) * 68.0 - p.z * 16.0 + n1 * 1.2);
                  float foreheadMask = smoothstep(0.03, 0.16, p.y) * smoothstep(-0.05, 0.18, p.z) * smoothstep(0.15, 0.01, abs(p.x));
                  float cheekStripe = sin(p.y * 55.0 + p.z * 22.0) * smoothstep(0.07, 0.19, abs(p.x)) * smoothstep(-0.09, 0.06, p.y);
                  float stripeAmt = clamp(smoothstep(0.2, 0.85, crownM) * foreheadMask * 0.75 + smoothstep(0.35, 0.9, cheekStripe) * 0.55, 0.0, 0.85);
                  furCol = mix(furCol, uStripeColor, stripeAmt);

                  // Soft cream muzzle & chin
                  float muzzleCream = smoothstep(0.14, 0.27, p.z) * smoothstep(0.02, -0.10, p.y) * smoothstep(0.13, 0.02, abs(p.x));
                  furCol = mix(furCol, uBellyColor, muzzleCream * 0.86);
                } else if (uPartId == 2) {
                  // Ears: darker tips
                  float earTip = smoothstep(0.02, 0.12, p.y);
                  furCol = mix(furCol, uStripeColor, earTip * 0.65);
                } else if (uPartId == 3) {
                  // Paws: subtle lighter toe tips
                  float toeTips = smoothstep(0.01, 0.06, p.z) * smoothstep(0.03, -0.02, p.y);
                  furCol = mix(furCol, uBellyColor, toeTips * 0.65);
                } else if (uPartId == 4) {
                  // Tail: distinct raccoon-like tabby rings + dark tip
                  float rings = smoothstep(0.25, 0.85, sin(p.y * 36.0 + p.z * 36.0 + n1 * 1.4));
                  furCol = mix(furCol, uStripeColor, rings * 0.75);
                } else if (uPartId == 5) {
                  // Legs: subtle horizontal tabby bracelets
                  float legRing = smoothstep(0.38, 0.88, sin(p.y * 44.0 + n1 * 1.5));
                  furCol = mix(furCol, uStripeColor, legRing * 0.48);
                }
              } else if (uPatternType == 1) {
                // TUXEDO BI-COLOR (Jet black coat with crisp snowy white chest bib, chin, and mittens)
                furCol = mix(uBaseColor, uSecColor, microStrand * 0.45);
                if (uPartId == 0) {
                  float bib = smoothstep(0.24, 0.40, p.z) * smoothstep(0.25, 0.75, vAnatNormal.z) * smoothstep(0.20, -0.35, vAnatNormal.y) * smoothstep(0.14, 0.03, abs(p.x));
                  float belly = smoothstep(-0.30, -0.75, vAnatNormal.y);
                  furCol = mix(furCol, uBellyColor, clamp(bib + belly, 0.0, 1.0));
                } else if (uPartId == 1) {
                  float whiteBlaze = smoothstep(0.16, 0.25, p.z) * smoothstep(-0.01, -0.11, p.y) * smoothstep(0.11, 0.03, abs(p.x));
                  furCol = mix(furCol, uBellyColor, whiteBlaze);
                } else if (uPartId == 3) {
                  furCol = uBellyColor; // Snowy white mittens
                }
              } else if (uPatternType == 2) {
                // SIAMESE SEAL POINT (Warm cream body with dark seal brown mask, ears, paws & tail)
                furCol = mix(uBellyColor, uBaseColor, microStrand * 0.35);
                if (uPartId == 0) {
                  float haunchShade = smoothstep(0.1, -0.35, p.z) * smoothstep(-0.05, 0.65, vAnatNormal.y);
                  furCol = mix(furCol, uSecColor, haunchShade * 0.55);
                } else if (uPartId == 1) {
                  float sealMask = smoothstep(0.08, 0.25, p.z) * smoothstep(-0.09, 0.09, p.y) * smoothstep(0.16, 0.03, abs(p.x));
                  furCol = mix(furCol, uStripeColor, sealMask * 0.92);
                } else if (uPartId == 2 || uPartId == 3 || uPartId == 4) {
                  furCol = mix(uStripeColor, uSecColor, microStrand * 0.3);
                } else if (uPartId == 5) {
                  float lowerPoint = smoothstep(-0.04, -0.20, p.y);
                  furCol = mix(furCol, uStripeColor, lowerPoint * 0.85);
                }
              } else if (uPatternType == 3) {
                // SOLID COAT (Russian Blue / Bombay)
                furCol = mix(uBaseColor, uSecColor, clamp(0.25 + microStrand * 0.65 + vAnatNormal.y * 0.22, 0.0, 1.0));
              } else if (uPatternType == 4) {
                // CALICO TORTOISESHELL (Snowy white base with bold ginger & dark chocolate patches)
                furCol = uBellyColor;
                float patchA = furNoise(p * 4.2 + vec3(1.7, 2.3, 0.8));
                float patchB = furNoise(p * 4.8 + vec3(5.2, 1.1, 3.4));
                if (uPartId == 0 || uPartId == 1 || uPartId == 5) {
                  float gingerMask = smoothstep(0.47, 0.54, patchA) * smoothstep(-0.35, 0.25, vAnatNormal.y);
                  float darkMask = smoothstep(0.50, 0.57, patchB) * smoothstep(-0.25, 0.35, vAnatNormal.y);
                  furCol = mix(furCol, uSecColor, gingerMask);
                  furCol = mix(furCol, uStripeColor, darkMask);
                } else if (uPartId == 2 || uPartId == 4) {
                  furCol = mix(uSecColor, uStripeColor, smoothstep(0.35, 0.65, patchA));
                }
              }

              // Subtle micro-hair shading depth
              furCol *= (0.90 + 0.18 * microStrand);
              diffuseColor.rgb = furCol;`
            );
          };
          return mat;
        };

        this.furMaterial = createAnatomicalFurMaterial(0, 0.78);     // Torso
        this.headFurMaterial = createAnatomicalFurMaterial(1, 0.75); // Head & Muzzle
        this.earFurMaterial = createAnatomicalFurMaterial(2, 0.76);  // Ears
        this.pawFurMaterial = createAnatomicalFurMaterial(3, 0.76);  // Paws
        this.tailFurMaterial = createAnatomicalFurMaterial(4, 0.78); // Tail
        this.legFurMaterial = createAnatomicalFurMaterial(5, 0.77);  // Legs

        // White / Creamy Chest, Muzzle & Paw Material (fallback)
        this.whiteFurMaterial = new THREE.MeshPhysicalMaterial({
          color: 0xfdf7ef,
          normalMap: furMaps.normalMap,
          normalScale: new THREE.Vector2(0.45, 0.45),
          roughnessMap: furMaps.roughnessMap,

          sheen: 0.9,
          sheenRoughness: 0.4,
          sheenColor: new THREE.Color(0xffffff)
        });

        // Damp Pebbled Rhinarium (Nose Leather)
        this.noseMaterial = new THREE.MeshPhysicalMaterial({

        // Soft Pink Toe Beans & Inner Ear Skin

        // Eye Iris & Cornea Materials

        this.leftEyeTex = createEyeIrisTexture(eyeColors.left, this.pupilDilation);

        this.leftIrisMat = new THREE.MeshStandardMaterial({

      }

      // -------------------------------------------------------------------------
      // Custom Deformable Anatomical Torso Mesh (Spine-Lofted with Real-Time Pose Bending)
      // -------------------------------------------------------------------------
      createDeformableTorso() {
        const rings = 56;
        const radialSegments = 40;
        const geometry = new THREE.BufferGeometry();

        const vertexCount = (rings + 1) * (radialSegments + 1);
        const positions = new Float32Array(vertexCount * 3);
        const uvs = new Float32Array(vertexCount * 2);
        const indices = [];

        // Store rest-pose local cross-sections so updateTorsoDeformation() can bend & breathe the spine in real time!
        this.torsoRings = rings;
        this.torsoRadial = radialSegments;
        this.torsoBaseCrossSections = [];

        for (let i = 0; i <= rings; i++) {
          const u = i / rings; // 0 = front chest/neck base, 1 = rump/pelvis tip
          // Smooth hemispherical end-caps with organic feline anatomical profile
          const cap = Math.sin(Math.pow(u, 0.80) * Math.PI);

          // Width (mediolateral): fuller muscular ribcage (u ~ 0.30) and pelvis (u ~ 0.80), sleek waist (u ~ 0.58)
          const ribWidth = 0.235 * Math.exp(-Math.pow((u - 0.30) / 0.24, 2));
          const waistWidth = 0.165 * Math.exp(-Math.pow((u - 0.58) / 0.20, 2));
          const hipWidth = 0.225 * Math.exp(-Math.pow((u - 0.82) / 0.20, 2));
          const rx = (0.105 + ribWidth * 0.48 + waistWidth * 0.24 + hipWidth * 0.46) * cap;

          // Height (dorsoventral): deeper chest keel in front, tucked abdomen at flank
          const chestDepth = 0.255 * Math.exp(-Math.pow((u - 0.28) / 0.25, 2));
          const flankTuck = 0.185 * Math.exp(-Math.pow((u - 0.62) / 0.22, 2));
          const croupHeight = 0.225 * Math.exp(-Math.pow((u - 0.82) / 0.20, 2));
          const ry = (0.105 + chestDepth * 0.50 + flankTuck * 0.24 + croupHeight * 0.44) * cap;

          // Scapula (shoulder blade) dorsal prominence around u = 0.24
          const scapula = Math.exp(-Math.pow((u - 0.24) / 0.10, 2)) * 0.024 * cap;

          const ringPoints = [];
          for (let j = 0; j <= radialSegments; j++) {
            const v = j / radialSegments;
            const theta = v * Math.PI * 2; // 0 = top dorsal spine, PI = bottom sternum/belly
            const sinT = Math.sin(theta);
            const cosT = Math.cos(theta);

            // Shape cross-section: slightly broader dorsal back, subtle shoulder ridges, rounded sternum keel
            let localX = sinT * rx * (1.0 + 0.08 * Math.cos(theta * 2));
            let localY = cosT * ry;

            // Add shoulder blade bumps on upper-side back
            if (cosT > 0.35) {
              localY += scapula * Math.pow(Math.sin(theta * 2), 2);
            }
            // Subtle fur ruff fullness on lower chest
            if (u < 0.28 && cosT < -0.3) {
              const ruff = (1 - u / 0.28) * 0.022 * cap;
              localY -= ruff;
              localX *= 1.06;
            }

            ringPoints.push({ localX, localY, theta });

            const idx = i * (radialSegments + 1) + j;
            // UV mapping: u along spine, v wraps from dorsal spine (0.5) to belly edges (0 & 1)
            uvs[idx * 2] = 0.5 + 0.5 * (theta <= Math.PI ? theta / Math.PI : (theta - Math.PI * 2) / Math.PI);
            uvs[idx * 2 + 1] = u * 2.2;
          }
          this.torsoBaseCrossSections.push({ u, ringPoints });
        }

        for (let i = 0; i < rings; i++) {
          for (let j = 0; j < radialSegments; j++) {
            const a = i * (radialSegments + 1) + j;
            const b = (i + 1) * (radialSegments + 1) + j;
            const c = (i + 1) * (radialSegments + 1) + (j + 1);
            const d = i * (radialSegments + 1) + (j + 1);
            // Outward-facing counter-clockwise winding order
            indices.push(a, d, b);
            indices.push(b, d, c);
          }
        }

        geometry.setIndex(indices);
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

        this.torsoGeometry = geometry;
        this.updateTorsoDeformation(0, 0, 0, 0, 0);

        const torsoMesh = new THREE.Mesh(geometry, this.furMaterial);
        torsoMesh.castShadow = true;
        torsoMesh.receiveShadow = true;
        torsoMesh.userData.zone = 'back';
        this.interactableMeshes.push(torsoMesh);
        return torsoMesh;
      }

      // Real-time Spine Curve & Ribcage Breathing Deformation
      updateTorsoDeformation(sitBlend, stretchBlend, loafBlend, breathPhase, spineSway) {
        const posAttr = this.torsoGeometry.attributes.position;
        const pos = posAttr.array;
        const rings = this.torsoRings;
        const radial = this.torsoRadial;

        for (let i = 0; i <= rings; i++) {
          const { u, ringPoints } = this.torsoBaseCrossSections[i];

          // Base standing spine centerline (z from +0.46 chest to -0.48 rump, y ~ 0.50)
          let spineZ = 0.46 - u * 0.94;
          let spineY = 0.50 + Math.sin(u * Math.PI) * 0.032 - u * 0.02;
          let spineX = Math.sin(u * Math.PI) * spineSway * 0.045;

          // Sitting posture: front chest stays full above forelegs, rump drops down onto the floor
          if (sitBlend > 0.001) {
            const sitZ = 0.32 - Math.pow(u, 1.12) * 0.60;
            const sitY = 0.58 - Math.pow(u, 1.28) * 0.41 + Math.sin(u * Math.PI) * 0.055;
            spineZ = THREE.MathUtils.lerp(spineZ, sitZ, sitBlend);
            spineY = THREE.MathUtils.lerp(spineY, sitY, sitBlend);
          }

          // Stretching posture ("Big Stretch" bow: front chest dips low, lumbar arches up to high hips)
          if (stretchBlend > 0.001) {
            const strZ = 0.52 - u * 1.02;
            const strY = 0.28 + Math.pow(u, 1.3) * 0.30 - Math.sin(u * Math.PI * 1.2) * 0.05;
            spineZ = THREE.MathUtils.lerp(spineZ, strZ, stretchBlend);
            spineY = THREE.MathUtils.lerp(spineY, strY, stretchBlend);
          }

          // Loaf / Sleeping posture (compact low rounded back close to the ground)
          if (loafBlend > 0.001) {
            const lfZ = 0.40 - u * 0.82;
            const lfY = 0.23 + Math.sin(u * Math.PI) * 0.085;
            spineZ = THREE.MathUtils.lerp(spineZ, lfZ, loafBlend);
            spineY = THREE.MathUtils.lerp(spineY, lfY, loafBlend);
          }

          // Ribcage respiratory expansion (strongest at mid-thorax u ~ 0.35)
          const breathScale = 1.0 + Math.sin(breathPhase) * 0.032 * Math.exp(-Math.pow((u - 0.38) / 0.25, 2));

          // Compute local pitch angle of spine tangent so cross-sections stay perpendicular to the spine!
          const pitch = sitBlend * (0.68 * Math.pow(u, 0.7)) - stretchBlend * 0.28 * (1 - u);
          const cosP = Math.cos(pitch);
          const sinP = Math.sin(pitch);

          for (let j = 0; j <= radial; j++) {
            const pt = ringPoints[j];
            const lx = pt.localX * breathScale * (1.0 + loafBlend * 0.14 * Math.sin(u * Math.PI));
            const ly = pt.localY * breathScale;

            const wy = spineY + ly * cosP;
            const wz = spineZ - ly * sinP;
            const wx = spineX + lx;

            const idx = (i * (radial + 1) + j) * 3;
            pos[idx] = wx;
            pos[idx + 1] = wy;
            pos[idx + 2] = wz;
          }
        }

        posAttr.needsUpdate = true;
        this.torsoGeometry.computeVertexNormals();
      }

      // -------------------------------------------------------------------------
      // Anatomically Sculpted Feline Head, Muzzle, Ears, Eyes & Whiskers
      // -------------------------------------------------------------------------
      createSculptedHeadGeometry() {
        const geo = new THREE.SphereGeometry(0.215, 56, 48);
        const pos = geo.attributes.position;
        const v = new THREE.Vector3();

        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          // Normalize coordinates (-1..1)
          const nx = v.x / 0.215;
          const ny = v.y / 0.215;
          const nz = v.z / 0.215;

          // 1. Broaden zygomatic arches & flared feline cheek ruffs
          const cheekFlare = Math.exp(-Math.pow((ny + 0.18) / 0.42, 2)) * Math.exp(-Math.pow((nz - 0.05) / 0.55, 2));
          v.x *= 1.08 + cheekFlare * 0.26;

          // 2. Slightly flatten cranium top between ears
          if (ny > 0.45) {
            v.y -= (ny - 0.45) * 0.032 * Math.exp(-nx * nx * 2.0);
          }

          // 3. Sculpt forward nasal bridge & muzzle
          if (nz > 0.25) {
            const forward = (nz - 0.25) / 0.75;
            // Taper towards nose tip while keeping upper bridge defined
            const muzzleMask = Math.exp(-Math.pow(nx / 0.52, 2)) * Math.exp(-Math.pow((ny + 0.12) / 0.48, 2));
            v.z += muzzleMask * Math.pow(forward, 0.8) * 0.088;

            // Whisker pads (mystacial pads) swell on either side of the philtrum
            const padMask = Math.exp(-Math.pow((Math.abs(nx) - 0.24) / 0.18, 2)) *
                            Math.exp(-Math.pow((ny + 0.22) / 0.22, 2)) *
                            Math.exp(-Math.pow((nz - 0.82) / 0.25, 2));
            v.z += padMask * 0.032;
            v.x += Math.sign(nx) * padMask * 0.015;

            // Central philtrum groove below nose
            const philtrum = Math.exp(-Math.pow(nx / 0.06, 2)) *
                             Math.exp(-Math.pow((ny + 0.25) / 0.18, 2)) *
                             Math.exp(-Math.pow((nz - 0.88) / 0.2, 2));
            v.z -= philtrum * 0.012;
          }

          // 4. Orbital eye sockets depression & supraorbital brow ridge (recessed cleanly behind eyes!)
          const eyeDistL = Math.hypot(nx - 0.36, ny - 0.18, nz - 0.82);
          const eyeDistR = Math.hypot(nx + 0.36, ny - 0.18, nz - 0.82);
          const socket = Math.exp(-Math.pow(Math.min(eyeDistL, eyeDistR) / 0.34, 2));
          v.z -= socket * 0.042;

          const browMask = Math.exp(-Math.pow((Math.abs(nx) - 0.42) / 0.25, 2)) *
                           Math.exp(-Math.pow((ny - 0.42) / 0.14, 2)) *
                           Math.exp(-Math.pow((nz - 0.68) / 0.25, 2));
          v.z += browMask * 0.016;
          v.y += browMask * 0.008;

          pos.setXYZ(i, v.x, v.y, v.z);
        }

        geo.computeVertexNormals();
        return geo;
      }

      // Sculpted Parabolic Conch Ear Geometry
      createSculptedEarGeometry(isLeft) {
        const geo = new THREE.ConeGeometry(0.088, 0.21, 32, 20, false);
        // Shift base to y = 0
        geo.translate(0, 0.105, 0);
        const pos = geo.attributes.position;
        const v = new THREE.Vector3();
        const sign = isLeft ? 1 : -1;

        for (let i = 0; i < pos.count; i++) {
          v.fromBufferAttribute(pos, i);
          const h = v.y / 0.21; // 0 at skull base, 1 at ear tip

          // Flatten front-to-back into a conch shell, concave on the front (z > 0)
          v.z *= 0.48;
          if (v.z > 0) {
            // Concave auricle hollow on front face
            const hollow = Math.sin(h * Math.PI) * Math.exp(-Math.pow(v.x / 0.065, 2));
            v.z -= hollow * 0.036;
          } else {
            // Rounded convex back of ear
            v.z -= Math.sin(h * Math.PI) * 0.016;
          }

          // Round the tip gently and curve slightly outward
          const tipRound = Math.pow(h, 2.2);
          v.x += sign * tipRound * 0.016;
          v.z += tipRound * 0.014;

          pos.setXYZ(i, v.x, v.y, v.z);
        }

        geo.computeVertexNormals();
        return geo;
      }

        // Subtle dark philtrum & inverted-Y mouth cleft below nose

        // Inner mouth & fangs

        mouthCavity.scale.set(1.05, 0.36, 1.15);
        mouthCavity.position.set(0, 0.008, 0.050);

        // Tiny upper canine fangs (only peek slightly when jaw opens)
        for (const side of [-1, 1]) {
          const upperFang = new THREE.Mesh(new THREE.ConeGeometry(0.0035, 0.011, 8), this.clawMaterial);
          upperFang.rotation.x = Math.PI;
          upperFang.position.set(side * 0.019, -0.048, 0.236);
          this.headGroup.add(upperFang);

        // 4. Multi-Layer Photorealistic Feline Eyes + Eyelids
        this.leftEyeGroup = this.createEyeAssembly(true);
