<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A realistic, procedural, interactive Three.js cat." />
  <title>Miso — Interactive 3D Cat</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 3px solid var(--cp-accent-soft);
      outline-offset: 2px;
      border-color: var(--cp-accent);
    }

    #scene {
      position: fixed;
      inset: 0;
      touch-action: none;
      cursor: grab;
    }

    #scene:active {
      cursor: grabbing;
    }

    #scene.toy-active {
      cursor: crosshair;
    }

    .topbar {
      position: fixed;
      z-index: 4;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }

    .identity,
    .status-card,
    .control-dock,
    .hint {
      border: 1px solid var(--cp-border);
      background: var(--cp-panel-strong);
      box-shadow:
        0 0 2px color-mix(in srgb, var(--cp-text) 12%, transparent),
        0 1px 2px color-mix(in srgb, var(--cp-text) 14%, transparent);
    }

    .identity {
      width: min(332px, calc(100vw - 40px));
      padding: 16px;
      border-radius: 16px;
      pointer-events: auto;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      color: var(--cp-accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cp-success);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--cp-success) 16%, transparent);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--cp-text-muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status-card {
      min-width: 180px;
      padding: 12px 14px;
      border-radius: 0.625rem;
      pointer-events: auto;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 12px;
      color: var(--cp-text-muted);
    }

    .status-value {
      color: var(--cp-text);
      font-weight: 700;
    }

    .meter {
      height: 4px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--cp-surface-soft);
    }

    .meter-fill {
      width: 66%;
      height: 100%;
      border-radius: inherit;
      background: var(--cp-accent);
      transition: width 240ms ease;
    }

    .control-dock {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 24px);
      padding: 8px;
      border-radius: 16px;
      transform: translateX(-50%);
    }

    .action,
    .select-wrap {
      min-height: 42px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface);
      color: var(--cp-text);
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      cursor: pointer;
      transition:
        border-color 160ms ease,
        background 160ms ease,
        transform 160ms ease;
    }

    .action:hover {
      border-color: var(--cp-border-strong);
      background: var(--cp-surface-soft);
      transform: translateY(-1px);
    }

    .action.primary,
    .action[aria-pressed="true"] {
      border-color: var(--cp-accent);
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
    }

    .action.primary:hover,
    .action[aria-pressed="true"]:hover {
      background: var(--cp-accent-hover);
    }

    .icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 12px;
      color: var(--cp-text-muted);
    }

    select {
      min-height: 40px;
      border: 0;
      background: transparent;
      color: var(--cp-text);
      cursor: pointer;
      outline: none;
    }

    .hint {
      position: fixed;
      z-index: 3;
      right: 20px;
      bottom: 84px;
      max-width: 240px;
      padding: 10px 12px;
      border-radius: 0.625rem;
      color: var(--cp-text-muted);
      font-size: 12px;
      line-height: 1.4;
      transition:
        opacity 280ms ease,
        transform 280ms ease;
      pointer-events: none;
    }

    .hint.hidden {
      opacity: 0;
      transform: translateY(8px);
    }

    .sound-toggle {
      position: fixed;
      z-index: 4;
      top: 20px;
      right: 20px;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
    }

    .toast {
      position: fixed;
      z-index: 8;
      top: 22px;
      left: 50%;
      padding: 10px 14px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-panel-strong);
      color: var(--cp-text);
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translate(-50%, -12px);
      transition:
        opacity 180ms ease,
        transform 180ms ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .loader {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      background: var(--cp-bg);
      transition: opacity 500ms ease;
    }

    .loader.done {
      opacity: 0;
      pointer-events: none;
    }

    .loader-inner {
      display: grid;
      justify-items: center;
      gap: 12px;
      color: var(--cp-text-muted);
      font-size: 13px;
    }

    .paw-loader {
      width: 36px;
      height: 36px;
      color: var(--cp-accent);
      animation: pulse 900ms ease-in-out infinite alternate;
    }

    @keyframes pulse {
      to {
        transform: scale(1.12) rotate(4deg);
        opacity: 0.55;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        top: 12px;
        left: 12px;
        right: 12px;
      }

      .identity {
        width: min(270px, calc(100vw - 68px));
        padding: 13px;
      }

      .subtitle {
        display: none;
      }

      .status-card {
        display: none;
      }

      .sound-toggle {
        top: 12px;
        right: 12px;
      }

      .control-dock {
        bottom: 12px;
        width: calc(100vw - 24px);
        gap: 4px;
        padding: 6px;
        justify-content: center;
      }

      .action {
        flex: 0 0 auto;
        width: 42px;
        padding: 0;
      }

      .action-label {
        display: none;
      }

      .select-wrap {
        width: 78px;
        flex: 0 0 78px;
        gap: 0;
        padding: 0 6px;
      }

      .select-wrap > span {
        display: none;
      }

      select {
        width: 64px;
        font-size: 12px;
        text-overflow: ellipsis;
      }

      .hint {
        right: 12px;
        bottom: 76px;
      }
    }

    @media (max-width: 360px) {
      .select-wrap {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="loader" id="loader" aria-live="polite">
    <div class="loader-inner">
      <svg class="paw-loader" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M18 29c5 0 8-5 7-10s-5-9-10-8-7 6-6 11 4 7 9 7Zm28 0c-5 0-8-5-7-10s5-9 10-8 7 6 6 11-4 7-9 7ZM9 41c4 2 9 0 11-4s0-9-4-11-9 1-10 5-1 8 3 10Zm46 0c-4 2-9 0-11-4s0-9 4-11 9 1 10 5 1 8-3 10ZM32 25c-9 0-19 12-17 22 1 7 8 9 17 4 9 5 16 3 17-4 2-10-8-22-17-22Z" fill="currentColor"/>
      </svg>
      <span>Waking Miso up…</span>
    </div>
  </div>

  <canvas id="scene" aria-label="Interactive 3D cat scene"></canvas>

  <div class="topbar">
    <section class="identity" aria-label="Cat profile">
      <div class="eyebrow"><span class="live-dot"></span> Interactive companion</div>
      <h1>Miso</h1>
      <p class="subtitle">A curious procedural cat. Move slowly, offer a treat, or let her chase the light.</p>
    </section>
    <section class="status-card" aria-label="Cat mood">
      <div class="status-row">
        <span>Mood</span>
        <span class="status-value" id="mood">Curious</span>
      </div>
      <div class="meter" aria-hidden="true"><div class="meter-fill" id="moodMeter"></div></div>
    </section>
  </div>

  <button class="action sound-toggle" id="soundButton" type="button" aria-label="Toggle sound" aria-pressed="true">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>
      <path class="sound-wave" d="M15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"></path>
    </svg>
  </button>

  <div class="control-dock" aria-label="Cat controls">
    <button class="action primary" id="petButton" type="button" aria-label="Pet Miso">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8.2 11.4 6.7 7.9a1.7 1.7 0 0 1 3.1-1.4l1.5 3.3-1.9-5a1.7 1.7 0 1 1 3.2-1.2l1.8 4.8-.8-3a1.7 1.7 0 1 1 3.3-.9l1.3 4.8.2-.8a1.7 1.7 0 0 1 3.3.8l-1.2 5.1c-.7 3.2-3.7 5.4-7 5l-1.3-.2a6 6 0 0 1-4.8-3.8L6 12.3a1.7 1.7 0 0 1 2.2-.9Z"></path>
      </svg>
      <span class="action-label">Pet</span>
    </button>
    <button class="action" id="treatButton" type="button" aria-label="Offer a treat">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 8.5c-2.2-.5-3.7-2.3-3-4s2.9-1.8 4.5-.2C9 2.2 10.4 1 12 1s3 1.2 3.5 3.3c1.6-1.6 3.8-1.5 4.5.2s-.8 3.5-3 4l1 11.5H6L7 8.5Z"></path>
        <path d="M8 9h8"></path>
      </svg>
      <span class="action-label">Treat</span>
    </button>
    <button class="action" id="toyButton" type="button" aria-label="Toggle laser toy" aria-pressed="false">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="8" cy="16" r="4"></circle>
        <path d="M11 13 21 3M17 3h4v4"></path>
      </svg>
      <span class="action-label">Laser toy</span>
    </button>
    <button class="action" id="meowButton" type="button" aria-label="Ask Miso to meow">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 13V8l4 3 4-3v5c0 3-1.8 5-4 5s-4-2-4-5Z"></path>
        <path d="M15 9c2 1 2 5 0 6M18 6c4 3 4 9 0 12"></path>
      </svg>
      <span class="action-label">Meow</span>
    </button>
    <label class="select-wrap">
      <span>Coat</span>
      <select id="coatSelect" aria-label="Select coat color">
        <option value="tabby">Brown tabby</option>
        <option value="silver">Silver tabby</option>
        <option value="ginger">Ginger tabby</option>
        <option value="tuxedo">Tuxedo</option>
      </select>
    </label>
  </div>

  <div class="hint" id="hint">Drag to look around · Scroll to zoom · Click Miso to pet</div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const canvas = document.querySelector("#scene");
    const loader = document.querySelector("#loader");
    const hint = document.querySelector("#hint");
    const moodLabel = document.querySelector("#mood");
    const moodMeter = document.querySelector("#moodMeter");
    const toast = document.querySelector("#toast");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const css = getComputedStyle(document.documentElement);
    const cssColor = (name) => css.getPropertyValue(name).trim();

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(cssColor("--cp-bg"));
    scene.fog = new THREE.FogExp2(cssColor("--cp-bg"), 0.036);

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5.2, 3.1, 6.9);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.92, 0.2);
    controls.minDistance = 4.1;
    controls.maxDistance = 10;
    controls.minPolarAngle = 0.55;
    controls.maxPolarAngle = 1.52;
    controls.enablePan = false;

    let narrowFraming = null;
    function frameScene(force = false) {
      const aspect = window.innerWidth / window.innerHeight;
      const isNarrow = aspect < 0.58;
      camera.fov = isNarrow ? 52 : 34;
      controls.maxDistance = isNarrow ? 14 : 10;
      if (force || narrowFraming !== isNarrow) {
        camera.position.set(
          isNarrow ? 4.5 : 5.2,
          isNarrow ? 3.35 : 3.1,
          isNarrow ? 10.8 : 6.9
        );
        controls.target.set(0, isNarrow ? 1.02 : 0.92, 0.2);
      }
      narrowFraming = isNarrow;
      camera.updateProjectionMatrix();
      controls.update();
    }
    frameScene(true);

    const environment = new RoomEnvironment();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(environment, 0.04).texture;
    environment.dispose();
    pmrem.dispose();

    const keyLight = new THREE.DirectionalLight(0xfff4e8, 3.3);
    keyLight.position.set(4.5, 7, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.camera.left = -4;
    keyLight.shadow.camera.right = 4;
    keyLight.shadow.camera.top = 4;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xb8d4ff, 1.45);
    rimLight.position.set(-4, 4, -4);
    scene.add(rimLight);

    const warmFill = new THREE.PointLight(0xffb99a, 1.4, 9, 2);
    warmFill.position.set(-3.5, 2.4, 3);
    scene.add(warmFill);

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(cssColor("--cp-bg-elevated")),
      roughness: 0.86,
      metalness: 0
    });
    const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 96), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const rug = new THREE.Mesh(
      new THREE.CircleGeometry(2.45, 96),
      new THREE.MeshStandardMaterial({
        color: new THREE.Color(cssColor("--cp-surface-soft")),
        roughness: 1
      })
    );
    rug.rotation.x = -Math.PI / 2;
    rug.position.y = 0.004;
    rug.receiveShadow = true;
    scene.add(rug);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(2.47, 2.49, 96),
      new THREE.MeshBasicMaterial({
        color: new THREE.Color(cssColor("--cp-border")),
        transparent: true,
        opacity: 0.7,
        side: THREE.DoubleSide
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.008;
    scene.add(ring);

    const coatPresets = {
      tabby: {
        base: "#81624a",
        light: "#b89a78",
        dark: "#2b211c",
        chest: "#c9b69b",
        stripe: "#33251e",
        nose: "#8d5d59",
        eye: "#b7c765"
      },
      silver: {
        base: "#8f9294",
        light: "#c7c8c5",
        dark: "#2c3032",
        chest: "#dadbd7",
        stripe: "#34383b",
        nose: "#a87878",
        eye: "#b8cf73"
      },
      ginger: {
        base: "#b66d2f",
        light: "#e1ac65",
        dark: "#6e3319",
        chest: "#f0cf9d",
        stripe: "#7c3f1d",
        nose: "#aa6960",
        eye: "#b6ca66"
      },
      tuxedo: {
        base: "#242629",
        light: "#4d5052",
        dark: "#111214",
        chest: "#e5e2da",
        stripe: "#0e0f10",
        nose: "#a46a72",
        eye: "#afc96e"
      }
    };

    let activePreset = coatPresets.tabby;
    const coatMaterials = [];
    const chestMaterials = [];
    const stripeMaterials = [];
    const eyeIrisMaterials = [];
    const noseMaterials = [];

    function createFurTexture(preset) {
      const textureCanvas = document.createElement("canvas");
      textureCanvas.width = 512;
      textureCanvas.height = 512;
      const ctx = textureCanvas.getContext("2d");
      ctx.fillStyle = preset.base;
      ctx.fillRect(0, 0, 512, 512);

      const gradient = ctx.createLinearGradient(0, 0, 512, 512);
      gradient.addColorStop(0, preset.light);
      gradient.addColorStop(0.42, preset.base);
      gradient.addColorStop(1, preset.dark);
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 512);

      ctx.globalAlpha = 0.21;
      ctx.lineCap = "round";
      for (let y = -80; y < 600; y += 56) {
        ctx.strokeStyle = preset.stripe;
        ctx.lineWidth = 13 + Math.random() * 10;
        ctx.beginPath();
        ctx.moveTo(-30, y);
        ctx.bezierCurveTo(120, y + 55, 285, y - 40, 545, y + 24);
        ctx.stroke();
      }

      ctx.globalAlpha = 0.18;
      for (let i = 0; i < 12500; i += 1) {
        const value = 80 + Math.floor(Math.random() * 170);

    function ensureAudio() {

    function playPurr() {
      if (!soundEnabled) return;
      const context = ensureAudio();
      const now = context.currentTime;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      const tremolo = context.createOscillator();
      const tremoloGain = context.createGain();
      oscillator.type = "sawtooth";
      oscillator.frequency.setValueAtTime(32, now);
      tremolo.frequency.setValueAtTime(24, now);
      tremoloGain.gain.setValueAtTime(0.018, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.045, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.15);
      tremolo.connect(tremoloGain);
      tremoloGain.connect(gain.gain);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start(now);
      tremolo.start(now);
      oscillator.stop(now + 1.2);
      tremolo.stop(now + 1.2);
    }

    function playMeow() {
      if (!soundEnabled) {
        showToast("Sound is muted");
        return;

      const context = ensureAudio();
      const now = context.currentTime;
      const output = context.createGain();
      output.gain.setValueAtTime(0.0001, now);
      output.gain.exponentialRampToValueAtTime(0.17, now + 0.045);
      output.gain.exponentialRampToValueAtTime(0.0001, now + 0.82);
      output.connect(context.destination);

      for (const [ratio, amount] of [[1, 0.8], [2.03, 0.23], [3.1, 0.09]]) {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = ratio === 1 ? "sawtooth" : "sine";
        oscillator.frequency.setValueAtTime(440 * ratio, now);
        oscillator.frequency.exponentialRampToValueAtTime(610 * ratio, now + 0.17);
        oscillator.frequency.exponentialRampToValueAtTime(330 * ratio, now + 0.78);
        gain.gain.value = amount;
        oscillator.connect(gain).connect(output);
        oscillator.start(now);
        oscillator.stop(now + 0.85);
      }
      headPivot.rotation.x = 0.13;
      updateMood("Chatty", 82);
      showToast("Miso says hello");

      const breath = Math.sin(elapsed * 2.1) * 0.012 * motionScale;
      body.scale.y = 0.84 + breath;
      chest.scale.y = 0.77 + breath * 1.5;
      bodyGroup.position.y = Math.sin(elapsed * 2.1) * 0.005 * motionScale;

      petEnergy = THREE.MathUtils.damp(petEnergy, targetPetEnergy, 5, delta);
      const petWave = Math.sin((elapsed - petStart) * 7) * petEnergy;

      const lookX = toyActive ? laserDot.position.x * 0.15 : pointer.x * 0.19;
      const lookY = toyActive ? (laserDot.position.z - 0.8) * 0.1 : pointer.y * 0.09;
      headPivot.rotation.y = THREE.MathUtils.damp(
        headPivot.rotation.y,
        lookX + petWave * 0.04,
        3.4,
        delta
      );
      headPivot.rotation.x = THREE.MathUtils.damp(
        headPivot.rotation.x,
        -lookY + petEnergy * 0.12,
        3.4,
        delta
      );
      headPivot.rotation.z = THREE.MathUtils.damp(
        headPivot.rotation.z,
        petEnergy * 0.13 + Math.sin(elapsed * 0.6) * 0.012,
        3,
        delta
      );

      const eyeTrackX = THREE.MathUtils.clamp(lookX * 0.16, -0.025, 0.025);
      const eyeTrackY = THREE.MathUtils.clamp(-lookY * 0.12, -0.018, 0.018);
      [eyeL, eyeR].forEach((eye) => {
        eye.iris.position.x = eyeTrackX;
        eye.iris.position.y = eyeTrackY;
        eye.pupil.position.x = eyeTrackX;
        eye.pupil.position.y = eyeTrackY;
      });

      if (elapsed > nextBlink) {
        blinkStart = elapsed;
        nextBlink = elapsed + 2.8 + Math.random() * 4.6;
      }
      const blinkTime = elapsed - blinkStart;
      const blinkAmount = blinkTime < 0.22
        ? Math.sin((blinkTime / 0.22) * Math.PI)
        : 0;
      const eyeScaleY = Math.max(0.08, 1 - blinkAmount * 0.94);
      eyeL.group.scale.y = eyeScaleY;
      eyeR.group.scale.y = eyeScaleY;

      earL.rotation.z = -0.19 + Math.sin(elapsed * 0.78) * 0.018;
      earR.rotation.z = 0.19 - Math.sin(elapsed * 0.7 + 1.1) * 0.02;
      if (toyActive) {
        earL.rotation.x = Math.sin(elapsed * 5.1) * 0.04;
        earR.rotation.x = Math.sin(elapsed * 4.7 + 1.8) * 0.04;
      } else {
        earL.rotation.x = 0;
        earR.rotation.x = 0;
      }

      tailPivots.forEach((pivot, index) => {
        const falloff = index / tailPivots.length;
        pivot.rotation.z =
          (index < 3 ? 0.32 : -0.04) +
          Math.sin(elapsed * 1.45 - index * 0.32) * (0.045 + falloff * 0.09) * motionScale;
        pivot.rotation.x =
          (index < 2 ? -0.22 : 0.06) +
          Math.sin(elapsed * 1.1 + index * 0.2) * 0.025 * motionScale;
      });

      const treatAge = elapsed - treatStart;
      if (treatAge >= 0 && treatAge < 3.3) {
        if (treatAge < 1.05) {
          const p = easeOutCubic(treatAge / 1.05);
          const start = new THREE.Vector3(2.8, 3.4, 3.5);
          const end = new THREE.Vector3(0, 1.44, 1.53);
          treat.position.lerpVectors(start, end, p);
          treat.position.y += Math.sin(p * Math.PI) * 0.7;
          treat.rotation.x += delta * 7;
          treat.rotation.y += delta * 4;
        } else {
          treat.position.set(0, 1.43, 1.52);
          treat.scale.setScalar(Math.max(0.02, 1 - (treatAge - 1.05) / 0.65));
        }
        headPivot.rotation.x -= Math.sin(Math.min(treatAge, 1) * Math.PI) * 0.04;
      } else {
        treat.scale.setScalar(1);
      }

      if (toyActive) {
        if (elapsed > nextSwat) {
          swatStart = elapsed;
          nextSwat = elapsed + 2.2 + Math.random() * 2.2;
        }
        const swatAge = elapsed - swatStart;
        const swat = swatAge < 0.58 ? Math.sin((swatAge / 0.58) * Math.PI) : 0;
        const swattingRight = laserDot.position.x > 0;
        const activeLeg = swattingRight ? frontLegR : frontLegL;
        activeLeg.rotation.x = -swat * 0.82;
        activeLeg.rotation.z = (swattingRight ? -1 : 1) * swat * 0.23;
        const inactiveLeg = swattingRight ? frontLegL : frontLegR;
        inactiveLeg.rotation.x = THREE.MathUtils.damp(inactiveLeg.rotation.x, 0, 8, delta);
        inactiveLeg.rotation.z = THREE.MathUtils.damp(inactiveLeg.rotation.z, 0, 8, delta);
      } else {
        [frontLegL, frontLegR].forEach((leg) => {
          leg.rotation.x = THREE.MathUtils.damp(leg.rotation.x, 0, 8, delta);
          leg.rotation.z = THREE.MathUtils.damp(leg.rotation.z, 0, 8, delta);
        });
      }

      hearts.forEach((heart, index) => {
        if (!heart.visible) return;
        const age = elapsed - heart.userData.start;
        if (age < 0) return;
        heart.position.y += delta * (0.52 + index * 0.025);
        heart.position.x += delta * heart.userData.drift;
        heart.lookAt(camera.position);
        heart.rotation.z += delta * 0.7;
        heart.material.opacity = Math.max(0, 1 - age / 1.35);
        if (age > 1.35) heart.visible = false;
      });

      if (performance.now() - lastInteraction > 15000 && !toyActive) {
        updateMood("Relaxed", 72);
        lastInteraction = performance.now();
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      frameScene();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }
    window.addEventListener("resize", onResize);

    const themeObserver = new MutationObserver(() => {
      const currentCss = getComputedStyle(document.documentElement);
      const currentColor = (name) => currentCss.getPropertyValue(name).trim();
      scene.background.set(currentColor("--cp-bg"));
      scene.fog.color.set(currentColor("--cp-bg"));
      floorMaterial.color.set(currentColor("--cp-bg-elevated"));
      rug.material.color.set(currentColor("--cp-surface-soft"));
      ring.material.color.set(currentColor("--cp-border"));
      laserMaterial.color.set(currentColor("--cp-danger"));
      laserGlow.color.set(currentColor("--cp-danger"));
      hearts.forEach((heart) => heart.material.color.set(currentColor("--cp-accent")));
    });
    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

    requestAnimationFrame(() => {
      loader.classList.add("done");
      window.setTimeout(() => loader.remove(), 520);
    });
    animate();
  </script>
</body>
</html>
