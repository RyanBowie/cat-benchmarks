<!doctype html>
<html lang="en-US" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Miso — Interactive 3D Cat</title>
  <style>
    :root {
      --ink: #f7f1e8;
      --muted: #bdb4aa;
      --panel: rgba(24, 22, 22, .72);
      --panel-strong: rgba(34, 31, 30, .9);
      --line: rgba(255, 255, 255, .13);
      --accent: #ffb464;
      --accent-2: #f27f73;
      --shadow: rgba(0, 0, 0, .36);
      --sky-a: #191a22;
      --sky-b: #332b2a;
      --focus: #ffd099;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --ink: #28231f;
        --muted: #6f655e;
        --panel: rgba(255, 252, 246, .76);
        --panel-strong: rgba(255, 252, 246, .94);
        --line: rgba(55, 45, 38, .13);
        --accent: #c65f31;
        --accent-2: #b6484b;
        --shadow: rgba(57, 42, 32, .18);
        --sky-a: #efe5d8;
        --sky-b: #d9c8b9;
        --focus: #873d1f;
      }
    }
    * { box-sizing: border-box; }
    html, body { inline-size: 100%; block-size: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 72% 18%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 31%),
        linear-gradient(145deg, var(--sky-a), var(--sky-b));
      touch-action: none;
    }
    button, select { font: inherit; }
    #app, #scene { position: fixed; inset: 0; }
    #scene canvas { inline-size: 100%; block-size: 100%; display: block; outline: none; }
    .topbar {
      position: fixed;
      inset-block-start: max(18px, env(safe-area-inset-top));
      inset-inline: max(18px, env(safe-area-inset-left)) max(18px, env(safe-area-inset-right));
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      pointer-events: none;
      z-index: 3;
    }
    .brand { pointer-events: auto; max-inline-size: min(440px, 66vw); }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-block-end: 8px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .live-dot {
      inline-size: 7px;
      block-size: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 16%, transparent);
      animation: breatheDot 2.4s ease-in-out infinite;
    }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 64px); line-height: .92; letter-spacing: -.055em; font-weight: 760; }
    .subtitle { margin: 10px 0 0; max-inline-size: 42ch; color: var(--muted); font-size: clamp(12px, 1.4vw, 15px); line-height: 1.5; }
    .status-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel);
      box-shadow: 0 14px 42px var(--shadow);
      backdrop-filter: blur(18px) saturate(1.2);
      font-size: 12px;
      white-space: nowrap;
    }
    .status-pill strong { color: var(--ink); font-weight: 720; }
    .controls {
      position: fixed;
      inset-inline-start: 50%;
      inset-block-end: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 4;
      inline-size: min(760px, calc(100vw - 28px));
      display: grid;
      grid-template-columns: auto auto auto minmax(140px, 1fr) auto;
      gap: 8px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 18px 60px var(--shadow);
      backdrop-filter: blur(22px) saturate(1.25);
    }
    .control, .coat-wrap {
      min-block-size: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, .055);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .control {
      padding: 0 14px;
      cursor: pointer;
      font-weight: 680;
    }
    .control:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 65%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .control:active { transform: translateY(0) scale(.98); }
    .control[aria-pressed="true"] { color: #21160f; background: var(--accent); border-color: var(--accent); }
    .control:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .coat-wrap { display: flex; align-items: center; padding-inline: 12px 8px; gap: 8px; min-inline-size: 0; }
    .coat-wrap label { color: var(--muted); font-size: 11px; font-weight: 760; text-transform: uppercase; letter-spacing: .08em; }
    select { flex: 1; min-inline-size: 0; block-size: 32px; color: var(--ink); background: transparent; border: 0; cursor: pointer; font-weight: 650; }
    select option { color: #241f1b; background: #f4ede4; }
    .hint {
      position: fixed;
      inset-inline-end: max(18px, env(safe-area-inset-right));
      inset-block-end: 84px;
      z-index: 3;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      text-align: end;
      pointer-events: none;
      opacity: .8;
    }
    .toast {
      position: fixed;
      inset-inline-start: 50%;
      inset-block-start: 24%;
      transform: translate(-50%, -10px) scale(.96);
      z-index: 5;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-strong);
      color: var(--ink);
      box-shadow: 0 16px 42px var(--shadow);
      font-size: 13px;
      font-weight: 680;
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
    .loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--sky-a), var(--sky-b));
      transition: opacity .55s ease, visibility .55s ease;
    }
    .loading.done { opacity: 0; visibility: hidden; }
    .loader-cat { display: grid; justify-items: center; gap: 16px; }
    .loader-ring { inline-size: 46px; block-size: 46px; border-radius: 50%; border: 2px solid var(--line); border-block-start-color: var(--accent); animation: spin 1s linear infinite; }
    .loader-cat span { color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .noscript { position: fixed; inset: 0; display: grid; place-items: center; padding: 28px; background: #201c1b; color: #fff; text-align: center; z-index: 20; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breatheDot { 50% { opacity: .5; transform: scale(.72); } }
    @media (max-width: 690px) {
      .topbar { inset-block-start: 14px; inset-inline: 14px; }
      .subtitle { max-inline-size: 32ch; }
      .status-pill { display: none; }
      .controls { grid-template-columns: repeat(3, 1fr); border-radius: 16px; }
      .control { padding-inline: 9px; font-size: 12px; }
      .coat-wrap { grid-column: span 2; }
      #reset { grid-column: span 1; }
      .hint { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <div id="scene" aria-label="Interactive 3D scene featuring Miso the cat"></div>
    <header class="topbar">
      <div class="brand">
        <div class="eyebrow"><span class="live-dot"></span>Living portrait</div>
        <h1>Miso</h1>
        <p class="subtitle">A procedural three.js cat. Drag to orbit, scroll to zoom, or move your pointer and watch Miso follow you.</p>
      </div>
      <div class="status-pill"><span>mood</span><strong id="moodText">curious</strong></div>
    </header>
    <main class="controls" aria-label="Cat interactions">
      <button class="control" id="pet" type="button">Pet Miso</button>
      <button class="control" id="meow" type="button">Meow</button>
      <button class="control" id="laser" type="button" aria-pressed="false">Laser toy</button>
      <div class="coat-wrap">
        <label for="coat">Coat</label>
        <select id="coat">
          <option value="ginger">Ginger tabby</option>
          <option value="silver">Silver tabby</option>
          <option value="tuxedo">Tuxedo</option>
          <option value="cream">Warm cream</option>
        </select>
      </div>
      <button class="control" id="reset" type="button">Reset view</button>
    </main>
    <div class="hint">Click Miso for a surprise<br>Press M for sound · L for laser</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="loading" id="loading"><div class="loader-cat"><div class="loader-ring"></div><span>Waking Miso…</span></div></div>
  </div>
  <noscript><div class="noscript">This interactive cat needs JavaScript enabled.</div></noscript>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const mount = document.querySelector('#scene');
    const loading = document.querySelector('#loading');
    const moodText = document.querySelector('#moodText');
    const toast = document.querySelector('#toast');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x191615, 0.044);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(5.8, 3.4, 7.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.tabIndex = 0;
    renderer.domElement.setAttribute('role', 'img');
    renderer.domElement.setAttribute('aria-label', 'A realistic, animated 3D ginger cat named Miso sitting in a softly lit room.');
    mount.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 4.6;
    controls.maxDistance = 11;
    controls.minPolarAngle = 0.55;
    controls.maxPolarAngle = 1.55;
    controls.target.set(0, 1.4, 0.15);

    // Lighting: a warm key, cool window fill, and gentle rim.
    scene.add(new THREE.HemisphereLight(0xcbd7ff, 0x4b2f22, 1.55));
    const key = new THREE.SpotLight(0xffd6ad, 52, 18, Math.PI * 0.24, 0.7, 1.25);
    key.position.set(-4.5, 7.5, 5.2);
    key.target.position.set(0, 1.2, 0);
    key.castShadow = true;
    key.shadow.mapSize.set(1536, 1536);
    key.shadow.bias = -0.00025;
    scene.add(key, key.target);
    const fill = new THREE.DirectionalLight(0x91a8cf, 2.4);
    fill.position.set(5, 4, -4);
    scene.add(fill);
    const rim = new THREE.PointLight(0xff8f68, 18, 8, 2);
    rim.position.set(-3.2, 2.4, -2.8);
    scene.add(rim);

    // Quiet architectural backdrop, all procedural.
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2421, roughness: 0.92, metalness: 0 });
    const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 96), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const rugMat = new THREE.MeshStandardMaterial({ color: 0x68483d, roughness: 0.98, side: THREE.DoubleSide });
    const rug = new THREE.Mesh(new THREE.CircleGeometry(2.35, 64), rugMat);
    rug.rotation.x = -Math.PI / 2;
    rug.position.y = 0.012;
    rug.scale.set(1.25, 1, 0.78);
    rug.receiveShadow = true;
    scene.add(rug);

    const ringMat = new THREE.MeshBasicMaterial({ color: 0xb97d62, transparent: true, opacity: 0.18, side: THREE.DoubleSide });
    for (let i = 0; i < 6; i++) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.32 + i * .31, 0.325 + i * .31, 80), ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.017 + i * 0.0001;
      ring.scale.set(1.25, 1, 0.78);
      scene.add(ring);
    }

    const windowGlow = new THREE.Mesh(
      new THREE.PlaneGeometry(2.5, 4.2),
      new THREE.MeshBasicMaterial({ color: 0xf5c89e, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    windowGlow.position.set(-4.4, 3.1, -3.2);
    windowGlow.rotation.y = 0.55;
    scene.add(windowGlow);

    // Floating dust gives the portrait depth without external textures.
    const dustGeo = new THREE.BufferGeometry();
    const dust = [];
    for (let i = 0; i < 190; i++) dust.push((Math.random() - .5) * 12, Math.random() * 6, (Math.random() - .5) * 9);
    dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dust, 3));
    const dustPoints = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffd5ad, size: .018, transparent: true, opacity: .34, depthWrite: false }));
    scene.add(dustPoints);

    const cat = new THREE.Group();
    cat.rotation.y = -0.03;
    scene.add(cat);

    const palette = {
      ginger: { fur: 0xb86f3f, secondary: 0xe0a16b, dark: 0x6c3827, chest: 0xe9c39b, nose: 0x9e5d59, eye: 0x93b564, rug: 0x68483d },
      silver: { fur: 0x8f9297, secondary: 0xbec1c5, dark: 0x41454c, chest: 0xd8d9d8, nose: 0x875e66, eye: 0x8fb99b, rug: 0x4d5260 },
      tuxedo: { fur: 0x242425, secondary: 0x383839, dark: 0x111112, chest: 0xe8e5df, nose: 0x8e5d62, eye: 0xc5a858, rug: 0x5b3b43 },
      cream: { fur: 0xc8a77c, secondary: 0xe2c9a6, dark: 0x7e6653, chest: 0xf1ddc1, nose: 0xa76968, eye: 0x6fa0a5, rug: 0x766153 }
    };
    let activePalette = palette.ginger;

    const furMat = new THREE.MeshPhysicalMaterial({ color: activePalette.fur, roughness: .86, metalness: 0, sheen: .52, sheenRoughness: .92, sheenColor: activePalette.secondary, clearcoat: .02 });
    const secondaryMat = new THREE.MeshPhysicalMaterial({ color: activePalette.secondary, roughness: .89, sheen: .35, sheenColor: 0xffffff });
    const chestMat = new THREE.MeshPhysicalMaterial({ color: activePalette.chest, roughness: .93, sheen: .28, sheenColor: 0xffffff });
    const stripeMat = new THREE.MeshStandardMaterial({ color: activePalette.dark, roughness: .9, transparent: true, opacity: .88 });
    const noseMat = new THREE.MeshPhysicalMaterial({ color: activePalette.nose, roughness: .55, clearcoat: .25 });
    const innerEarMat = new THREE.MeshPhysicalMaterial({ color: 0xca7e79, roughness: .78, side: THREE.DoubleSide });
    const eyeWhiteMat = new THREE.MeshPhysicalMaterial({ color: 0xdce4cf, roughness: .15, clearcoat: 1, clearcoatRoughness: .08 });
    const irisMat = new THREE.MeshPhysicalMaterial({ color: activePalette.eye, roughness: .22, clearcoat: .85, emissive: activePalette.eye, emissiveIntensity: .035 });
    const pupilMat = new THREE.MeshBasicMaterial({ color: 0x050504 });
    const glossMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const whiskerMat = new THREE.MeshPhysicalMaterial({ color: 0xf4eee3, roughness: .38, transparent: true, opacity: .86 });

    const catMeshes = [];
    function register(mesh, shadows = true) {
      if (shadows) { mesh.castShadow = true; mesh.receiveShadow = true; }
      catMeshes.push(mesh);
      return mesh;
    }
    function ellipsoid(name, position, scale, material = furMat, segments = 40) {
      const mesh = register(new THREE.Mesh(new THREE.SphereGeometry(1, segments, Math.max(20, segments / 2)), material));
      mesh.name = name;
      mesh.position.set(...position);
      mesh.scale.set(...scale);
      cat.add(mesh);
      return mesh;
    }

    // Sitting silhouette: haunches, torso, chest and front legs.
    const body = ellipsoid('body', [0, 1.28, -0.35], [1.02, 1.12, 1.38]);
    body.rotation.x = -0.05;
    const chest = ellipsoid('chest', [0, 1.32, .54], [.77, 1.01, .73], secondaryMat);
    const haunchL = ellipsoid('haunch', [-.77, .72, -.63], [.67, .78, .82]);
    const haunchR = ellipsoid('haunch', [.77, .72, -.63], [.67, .78, .82]);

    const frontLegs = new THREE.Group();
    cat.add(frontLegs);
    for (const x of [-.41, .41]) {
      const leg = register(new THREE.Mesh(new THREE.CapsuleGeometry(.235, .76, 10, 20), secondaryMat));
      leg.position.set(x, .67, .62);
      leg.rotation.x = -.03;
      frontLegs.add(leg);
      const paw = register(new THREE.Mesh(new THREE.SphereGeometry(.31, 32, 20), secondaryMat));
      paw.position.set(x, .22, .86);
      paw.scale.set(1.05, .57, 1.35);
      frontLegs.add(paw);
      for (let t = -1; t <= 1; t += 2) {
        const toe = new THREE.Mesh(new THREE.TorusGeometry(.055, .009, 6, 18, Math.PI * .75), stripeMat);
        toe.position.set(x + t * .075, .225, 1.145);
        toe.rotation.set(Math.PI / 2, 0, Math.PI * .12 * t);
        frontLegs.add(toe);
      }
    }

    // Chest bib and small tufts break up the primitive silhouette.
    const bib = ellipsoid('bib', [0, 1.18, 1.06], [.46, .72, .2], chestMat, 32);
    const tuftGeo = new THREE.ConeGeometry(.12, .35, 4);
    for (let i = 0; i < 8; i++) {
      const tuft = register(new THREE.Mesh(tuftGeo, i % 3 === 0 ? chestMat : secondaryMat));
      const a = (i / 7 - .5) * 1.1;
      tuft.position.set(a * .43, .88 + Math.abs(a) * .08, 1.17 + Math.cos(i) * .035);
      tuft.rotation.z = -a * .52;
      tuft.rotation.x = -.12;
      tuft.scale.set(.75 + Math.random() * .25, .72 + Math.random() * .32, .7);
      cat.add(tuft);
    }

    const headRig = new THREE.Group();
    headRig.position.set(0, 2.32, .76);
    cat.add(headRig);

    function addHeadMesh(mesh) { register(mesh); headRig.add(mesh); return mesh; }
    const head = addHeadMesh(new THREE.Mesh(new THREE.SphereGeometry(1, 52, 32), furMat));
    head.scale.set(.88, .79, .81);

    const cheekL = addHeadMesh(new THREE.Mesh(new THREE.SphereGeometry(.43, 32, 20), secondaryMat));
    cheekL.position.set(-.39, -.06, .36); cheekL.scale.set(1, .86, .9);
    const cheekR = addHeadMesh(new THREE.Mesh(new THREE.SphereGeometry(.43, 32, 20), secondaryMat));
    cheekR.position.set(.39, -.06, .36); cheekR.scale.set(1, .86, .9);

    // Ears: triangular outer shells plus inset inner planes.
    const ears = [];
    for (const side of [-1, 1]) {
      const ear = addHeadMesh(new THREE.Mesh(new THREE.ConeGeometry(.43, .92, 3, 1, false), furMat));
      ear.position.set(side * .52, .64, -.02);
      ear.rotation.set(-.08, 0, side * -.17);
      ear.scale.z = .62;
      ears.push(ear);
      const inner = addHeadMesh(new THREE.Mesh(new THREE.ConeGeometry(.28, .63, 3, 1, false), innerEarMat));
      inner.position.set(side * .52, .64, .19);
      inner.rotation.set(-.08, 0, side * -.17);
      inner.scale.set(.84, .82, .08);
    }

    // Eyes use separate irises, pupils and catchlights for a wet, attentive gaze.
    const eyeRigs = [];
    const lids = [];
    for (const side of [-1, 1]) {
      const eyeRig = new THREE.Group();
      eyeRig.position.set(side * .31, .16, .69);
      headRig.add(eyeRig);
      const white = register(new THREE.Mesh(new THREE.SphereGeometry(.205, 32, 22), eyeWhiteMat));
      white.scale.set(1, 1.16, .55);
      eyeRig.add(white);
      const iris = register(new THREE.Mesh(new THREE.SphereGeometry(.133, 28, 18), irisMat));
      iris.position.z = .105;
      iris.scale.set(1, 1.05, .28);
      eyeRig.add(iris);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(.07, 20, 14), pupilMat);
      pupil.position.z = .145;
      pupil.scale.set(.38, 1.17, .18);
      eyeRig.add(pupil);
      const glint = new THREE.Mesh(new THREE.SphereGeometry(.026, 12, 8), glossMat);
      glint.position.set(-.048, .065, .172);
      eyeRig.add(glint);
      const glint2 = new THREE.Mesh(new THREE.SphereGeometry(.011, 10, 6), glossMat);
      glint2.position.set(.052, -.035, .173);
      eyeRig.add(glint2);
      const lid = new THREE.Mesh(new THREE.CircleGeometry(.235, 36), furMat);
      lid.position.z = .19;
      lid.scale.set(1.04, .001, 1);
      eyeRig.add(lid);
      lids.push(lid);
      eyeRigs.push(eyeRig);
    }

    // Forehead tabby markings.
    const stripeGeo = new THREE.CapsuleGeometry(.035, .34, 5, 10);
    for (const [x, rot] of [[0, 0], [-.18, -.25], [.18, .25]]) {
      const stripe = addHeadMesh(new THREE.Mesh(stripeGeo, stripeMat));
      stripe.position.set(x, .39, .75);
      stripe.rotation.z = rot;
      stripe.rotation.x = Math.PI / 2;
      stripe.scale.set(1, 1, .34);
    }

    // Muzzle, nose, mouth and chin.
    const muzzleL = addHeadMesh(new THREE.Mesh(new THREE.SphereGeometry(.3, 28, 18), chestMat));
    muzzleL.position.set(-.17, -.20, .68); muzzleL.scale.set(1, .68, .66);
    const muzzleR = addHeadMesh(new THREE.Mesh(new THREE.SphereGeometry(.3, 28, 18), chestMat));
    muzzleR.position.set(.17, -.20, .68); muzzleR.scale.set(1, .68, .66);
    const chin = addHeadMesh(new THREE.Mesh(new THREE.SphereGeometry(.22, 24, 16), chestMat));
    chin.position.set(0, -.40, .55); chin.scale.set(1.05, .5, .62);
    const nose = addHeadMesh(new THREE.Mesh(new THREE.ConeGeometry(.115, .13, 3), noseMat));
    nose.position.set(0, -.17, .93);
    nose.rotation.set(Math.PI / 2, 0, Math.PI);
    nose.scale.set(1.15, 1, .55);

    const mouthMat = new THREE.MeshBasicMaterial({ color: 0x4d2828 });
    for (const side of [-1, 1]) {
      const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(0, -.285, .91),
        new THREE.Vector3(side * .09, -.36, .93),
        new THREE.Vector3(side * .17, -.31, .89)
      );
      const mouth = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, .009, 5, false), mouthMat);
      headRig.add(mouth);
    }

    // Whiskers are real curves, slightly asymmetric like natural fibers.
    const whiskers = new THREE.Group();
    headRig.add(whiskers);
    for (const side of [-1, 1]) {
      for (let i = 0; i < 4; i++) {
        const y = -.18 - i * .075;
        const start = new THREE.Vector3(side * .18, y, .93);
        const end = new THREE.Vector3(side * (1.0 + i * .06), y + (1.5 - i) * .06, .86 - i * .035);
        const controlA = new THREE.Vector3(side * .48, y + .02, 1.05);
        const controlB = new THREE.Vector3(side * .78, end.y, .98);
        const curve = new THREE.CubicBezierCurve3(start, controlA, controlB, end);
        whiskers.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 22, .008, 5, false), whiskerMat));
      }
    }

    // Subtle body stripes sit just above the coat.
    const stripeCurves = [
      [[-.85, 1.62, -.35], [-1.02, 1.53, .14], [-.89, 1.34, .38]],
      [[.85, 1.62, -.35], [1.02, 1.53, .14], [.89, 1.34, .38]],
      [[-.93, 1.28, -.76], [-1.09, 1.14, -.34], [-.97, .97, -.04]],
      [[.93, 1.28, -.76], [1.09, 1.14, -.34], [.97, .97, -.04]]
    ];
    for (const points of stripeCurves) {
      const c = new THREE.QuadraticBezierCurve3(...points.map(p => new THREE.Vector3(...p)));
      const stripe = register(new THREE.Mesh(new THREE.TubeGeometry(c, 20, .045, 7, false), stripeMat));
      cat.add(stripe);
    }

    // Tail is a tapered articulated chain, animated segment by segment.
    const tail = new THREE.Group();
    cat.add(tail);
    const tailSegments = [];
    const tailCount = 15;
    for (let i = 0; i < tailCount; i++) {
      const radius = THREE.MathUtils.lerp(.19, .065, i / (tailCount - 1));
      const segment = register(new THREE.Mesh(new THREE.CapsuleGeometry(radius, .34, 7, 12), i < 4 ? furMat : secondaryMat));
      tail.add(segment);
      tailSegments.push(segment);
    }

    // Laser dot and tiny glow.
    const laserMat = new THREE.MeshBasicMaterial({ color: 0xff2d2d });
    const laserDot = new THREE.Mesh(new THREE.SphereGeometry(.055, 18, 12), laserMat);
    laserDot.position.set(1.4, .055, 1.8);
    laserDot.visible = false;
    scene.add(laserDot);
    const laserLight = new THREE.PointLight(0xff1e1e, 1.6, 1.1, 2);
    laserLight.visible = false;
    scene.add(laserLight);

    // Hearts are instanced procedural particles.
    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, .18);
    heartShape.bezierCurveTo(-.28, .42, -.55, .06, 0, -.46);
    heartShape.bezierCurveTo(.55, .06, .28, .42, 0, .18);
    const heartGeo = new THREE.ShapeGeometry(heartShape, 8);
    const heartMat = new THREE.MeshBasicMaterial({ color: 0xff8c87, transparent: true, opacity: .9, side: THREE.DoubleSide, depthWrite: false });
    const hearts = [];
    function spawnHearts(count = 5) {
      for (let i = 0; i < count; i++) {
        const h = new THREE.Mesh(heartGeo, heartMat.clone());
        h.position.set((Math.random() - .5) * 1.1, 2.45 + Math.random() * .45, 1.25 + (Math.random() - .5) * .35);
        h.scale.setScalar(.12 + Math.random() * .08);
        h.userData.birth = performance.now();
        h.userData.vx = (Math.random() - .5) * .003;
        h.userData.vy = .0022 + Math.random() * .0016;
        scene.add(h);
        hearts.push(h);
      }
    }

    // Soft contact shadow for density beneath the paws.
    const shadowCanvas = document.createElement('canvas');
    shadowCanvas.width = shadowCanvas.height = 128;
    const sctx = shadowCanvas.getContext('2d');
    const grad = sctx.createRadialGradient(64, 64, 5, 64, 64, 62);
    grad.addColorStop(0, 'rgba(0,0,0,.42)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    sctx.fillStyle = grad; sctx.fillRect(0, 0, 128, 128);
    const contactShadow = new THREE.Mesh(
      new THREE.PlaneGeometry(3.6, 2.6),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false })
    );
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.set(0, .025, -.05);
    scene.add(contactShadow);

    const pointer = new THREE.Vector2(0, 0);
    const raycaster = new THREE.Raycaster();
    let hoverCat = false;
    let blinkStart = -10;
    let nextBlink = 2 + Math.random() * 3;
    let petUntil = 0;
    let meowUntil = 0;
    let laserOn = false;
    let moodTimer;
    let toastTimer;
    let audioCtx;

    function setMood(text, duration = 2400) {
      moodText.textContent = text;
      clearTimeout(moodTimer);
      moodTimer = setTimeout(() => { moodText.textContent = laserOn ? 'hunting' : 'curious'; }, duration);
    }
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
    function petMiso() {
      petUntil = performance.now() + 2600;
      spawnHearts(6);
      setMood('content', 2800);
      showToast('Miso is purring');
      purr();
    }
    function ensureAudio() {
      audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function purr() {
      const ctx = ensureAudio();
      const now = ctx.currentTime;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(.035, now + .08);
      gain.gain.setValueAtTime(.03, now + .65);
      gain.gain.exponentialRampToValueAtTime(.0001, now + 1.35);
      gain.connect(ctx.destination);
      for (const [freq, amount] of [[31, 1], [62, .35], [93, .12]]) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = freq === 31 ? 'sawtooth' : 'sine';
        osc.frequency.value = freq;
        g.gain.value = amount;
        osc.connect(g).connect(gain);
        osc.start(now); osc.stop(now + 1.4);
      }
    }
    function meow() {
      const ctx = ensureAudio();
      const now = ctx.currentTime;
      const master = ctx.createGain();
      master.gain.setValueAtTime(.0001, now);
      master.gain.exponentialRampToValueAtTime(.09, now + .035);
      master.gain.exponentialRampToValueAtTime(.035, now + .4);
      master.gain.exponentialRampToValueAtTime(.0001, now + .82);
      master.connect(ctx.destination);
      const frequencies = [[520, 690, 410], [790, 960, 650]];
      frequencies.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = idx ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(f[0], now);
        osc.frequency.exponentialRampToValueAtTime(f[1], now + .22);
        osc.frequency.exponentialRampToValueAtTime(f[2], now + .78);
        gain.gain.value = idx ? .28 : 1;
        osc.connect(gain).connect(master);
        osc.start(now); osc.stop(now + .84);
      });
      meowUntil = performance.now() + 780;
      setMood('chatty', 1500);
      showToast('mrrrow?');
    }

    function applyPalette(keyName) {
      activePalette = palette[keyName];
      furMat.color.setHex(activePalette.fur);
      furMat.sheenColor.setHex(activePalette.secondary);
      secondaryMat.color.setHex(activePalette.secondary);
      chestMat.color.setHex(activePalette.chest);
      stripeMat.color.setHex(activePalette.dark);
      noseMat.color.setHex(activePalette.nose);
      irisMat.color.setHex(activePalette.eye);
      irisMat.emissive.setHex(activePalette.eye);
      rugMat.color.setHex(activePalette.rug);
      showToast(`${document.querySelector('#coat').selectedOptions[0].text} coat`);
    }

    function updateTail(t) {
      const pts = [];
      for (let i = 0; i <= tailCount; i++) {
        const p = i / tailCount;
        const sway = Math.sin(t * 1.8 + p * 3.5) * .16 * p;
        pts.push(new THREE.Vector3(
          .74 + p * 1.15 + Math.sin(p * Math.PI) * .34 + sway,
          .62 + p * .84 + Math.sin(p * Math.PI) * .18,
          -1.43 + p * .34 - Math.sin(p * Math.PI * 1.25) * .42
        ));
      }
      const up = new THREE.Vector3(0, 1, 0);
      for (let i = 0; i < tailCount; i++) {
        const a = pts[i], b = pts[i + 1];
        const mid = a.clone().add(b).multiplyScalar(.5);
        const dir = b.clone().sub(a).normalize();
        tailSegments[i].position.copy(mid);
        tailSegments[i].quaternion.setFromUnitVectors(up, dir);
      }
    }

    function blink(t) {
      if (t > nextBlink && t - blinkStart > 1) {
        blinkStart = t;
        nextBlink = t + 2.3 + Math.random() * 4.8;
      }
      const d = t - blinkStart;
      let close = 0;
      if (d >= 0 && d < .22) close = Math.sin((d / .22) * Math.PI);
      lids.forEach(lid => { lid.scale.y = Math.max(.001, close); });
    }

    function onPointerMove(event) {
      pointer.x = (event.clientX / innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      hoverCat = raycaster.intersectObjects(catMeshes, false).length > 0;
      renderer.domElement.style.cursor = hoverCat ? 'pointer' : 'grab';
    }
    function onPointerDown() { renderer.domElement.style.cursor = hoverCat ? 'pointer' : 'grabbing'; }
    function onPointerUp() {
      renderer.domElement.style.cursor = hoverCat ? 'pointer' : 'grab';
      if (hoverCat) {
        if (Math.random() > .46) petMiso(); else meow();
      }
    }
    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerdown', onPointerDown);
    renderer.domElement.addEventListener('pointerup', onPointerUp);

    document.querySelector('#pet').addEventListener('click', petMiso);
    document.querySelector('#meow').addEventListener('click', meow);
    document.querySelector('#laser').addEventListener('click', (event) => {
      laserOn = !laserOn;
      event.currentTarget.setAttribute('aria-pressed', String(laserOn));
      laserDot.visible = laserLight.visible = laserOn;
      setMood(laserOn ? 'hunting' : 'curious', 1200);
      showToast(laserOn ? 'Laser toy on' : 'Laser toy off');
    });
    document.querySelector('#coat').addEventListener('change', event => applyPalette(event.target.value));
    document.querySelector('#reset').addEventListener('click', () => {
      camera.position.set(5.8, 3.4, 7.6);
      controls.target.set(0, 1.4, .15);
      controls.update();
      showToast('View reset');
    });
    addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'm') meow();
      if (event.key.toLowerCase() === 'l') document.querySelector('#laser').click();
      if (event.key === ' ') { event.preventDefault(); petMiso(); }
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    });

    const clock = new THREE.Clock();
    const targetHead = new THREE.Vector2();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const now = performance.now();

      controls.update();
      blink(t);
      updateTail(reducedMotion ? 0 : t);

      // Breathing and small life-like motions.
      const breath = reducedMotion ? 0 : Math.sin(t * 1.65) * .012;
      body.scale.y = 1.12 + breath;
      chest.scale.y = 1.01 + breath * 1.4;
      cat.position.y = Math.sin(t * .8) * .004;
      ears[0].rotation.z = .17 + Math.sin(t * 2.4) * .012;
      ears[1].rotation.z = -.17 - Math.sin(t * 2.4) * .012;
      if (!reducedMotion && Math.sin(t * .79) > .997) ears[Math.random() > .5 ? 0 : 1].rotation.x = -.26;
      else ears.forEach(e => e.rotation.x = THREE.MathUtils.lerp(e.rotation.x, -.08, .08));

      let lookX = pointer.x * .24;
      let lookY = pointer.y * .13;
      if (laserOn) {
        const a = t * .92;
        laserDot.position.set(Math.sin(a * 1.37) * 2.25, .055, 1.35 + Math.cos(a) * 1.35);
        laserLight.position.copy(laserDot.position).add(new THREE.Vector3(0, .18, 0));
        const local = cat.worldToLocal(laserDot.position.clone());
        lookX = THREE.MathUtils.clamp(local.x * .15, -.34, .34);
        lookY = THREE.MathUtils.clamp((local.z - .8) * -.06, -.12, .14);
      }
      if (now < petUntil) {
        lookX = -.19;
        lookY = -.08;
        headRig.position.y = 2.32 + Math.sin(t * 3.2) * .018;
        eyeRigs.forEach(e => e.scale.y = .82);
      } else {
        headRig.position.y = THREE.MathUtils.lerp(headRig.position.y, 2.32, .08);
        eyeRigs.forEach(e => e.scale.y = THREE.MathUtils.lerp(e.scale.y, 1, .08));
      }
      targetHead.set(lookY, lookX);
      headRig.rotation.x = THREE.MathUtils.lerp(headRig.rotation.x, targetHead.x, .055);
      headRig.rotation.y = THREE.MathUtils.lerp(headRig.rotation.y, targetHead.y, .055);
      headRig.rotation.z = THREE.MathUtils.lerp(headRig.rotation.z, now < petUntil ? -.08 : 0, .045);
      eyeRigs.forEach(e => { e.rotation.y = -headRig.rotation.y * .35; e.rotation.x = -headRig.rotation.x * .28; });

      // Brief mouth movement during the generated meow.
      const talking = now < meowUntil ? Math.sin((meowUntil - now) * .04) * .5 + .5 : 0;
      chin.position.y = -.40 - talking * .045;
      muzzleL.rotation.z = talking * .025;
      muzzleR.rotation.z = -talking * .025;

      // Heart particles float, wobble, fade, then dispose.
      for (let i = hearts.length - 1; i >= 0; i--) {
        const h = hearts[i];
        const age = now - h.userData.birth;
        h.position.x += h.userData.vx;
        h.position.y += h.userData.vy;
        h.rotation.y = t * 1.5 + i;
        h.rotation.z = Math.sin(t * 2 + i) * .25;
        h.material.opacity = Math.max(0, .9 - age / 1900);
        if (age > 1900) { scene.remove(h); h.material.dispose(); hearts.splice(i, 1); }
      }

      dustPoints.rotation.y = t * .008;
      renderer.render(scene, camera);
    }

    applyPalette('ginger');
    updateTail(0);
    animate();
    requestAnimationFrame(() => {
      loading.classList.add('done');
      showToast('Miso is awake');
    });
  </script>
</body>
</html>
